<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONSTANTS & TABLES  (all declared at top)
   ============================================================ */

const SEED = 1337;

// ---- seeded PRNG (mulberry32) ----
function makePRNG(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = makePRNG(SEED);
const rand = (a, b) => a + (b - a) * rng();
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length)];

// ---- palette ----
const COL = {
  sky:        0x8fa6b8,
  fog:        0x9fb0bd,
  ground:     0x6b7a52,
  groundDark: 0x55613f,
  rock:       0x7a7266,
  rockDark:   0x5c554b,
  rockLight:  0x8f877a,
  water:      0x3f6f86,
  waterDeep:  0x2f5a70,
  wall:       0x9a8f7c,
  wallDark:   0x7d7260,
  wallLight:  0xb0a48d,
  tower:      0x8a7f6c,
  roof:       0x6b4a3a,
  roofDark:   0x53382c,
  wood:       0x6b4f34,
  woodDark:   0x4d3824,
  tent:       0xb8a888,
  tentAlt:    0xa89878,
  tentDark:   0x8a7a5c,
  soldier:    0x4a5a6a,
  soldierAlt: 0x6a4a3a,
  soldierSkin:0xc9a888,
  tree:       0x3f5a34,
  treeDark:   0x2f4426,
  treeLight:  0x4f6a3e,
  trunk:      0x4a3a28,
  fire:       0xff8a3a,
  fireCore:   0xffd070,
  boulder:    0x6a6258,
  boulderDark:0x554e46,
  dust:       0xb8a888,
  rubble:     0x8a8070,
  banner:     0xa83a2a,
  bannerAlt:  0x2a5a8a,
  gold:       0xd8b060
};

// ---- world layout ----
const WORLD = {
  size: 260,
  groundY: 0,
  castleX: 0,
  castleZ: -30,
  castleW: 46,
  castleD: 34,
  wallH: 14,
  wallBlock: 2,
  riverZ: 55,
  riverW: 26,
  campZ: 95,
  campSpread: 90,
  forestCount: 900,
  soldierCount: 2600,
  tentCount: 340,
  fireCount: 60,
  trebuchetCount: 4
};

// ---- trebuchet geometry ----
const TREB = {
  baseW: 6, baseH: 2, baseD: 8,
  armLen: 18,
  armThick: 1.2,
  pivotH: 9,
  cwMass: 3.2,
  slingLen: 5,
  releaseAngle: -0.55,   // radians from vertical (arm falling forward)
  restAngle: 1.15,       // arm cocked back
  cycleTime: 7.5,        // seconds per shot
  boulderR: 1.6
};

// ---- physics ----
const GRAV = -32;
const DT_CLAMP = 1 / 30;

// ---- camera ----
const CAM = {
  orbitRadius: 130,
  orbitHeight: 62,
  orbitSpeed: 0.055,
  minRadius: 40,
  maxRadius: 240,
  minHeight: 12,
  maxHeight: 160,
  target: new THREE.Vector3(0, 6, 10)
};

// ---- HUD state ----
const hudState = {
  boulders: 0,
  wallPct: 100,
  troops: WORLD.soldierCount
};

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.sky);
scene.fog = new THREE.Fog(COL.fog, 140, 340);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.5, 900);
camera.position.set(0, CAM.orbitHeight, CAM.orbitRadius);

// ---- lights ----
const hemi = new THREE.HemisphereLight(0xbcd0e0, 0x5a5040, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe6c0, 2.1);
sun.position.set(-90, 130, 70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 420;
sun.shadow.camera.left = -180;
sun.shadow.camera.right = 180;
sun.shadow.camera.top = 180;
sun.shadow.camera.bottom = -180;
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 0, 10);

const fill = new THREE.DirectionalLight(0x8098b0, 0.35);
fill.position.set(80, 60, -60);
scene.add(fill);

/* ============================================================
   MATERIALS  (flat colour, shared)
   ============================================================ */

const matCache = {};
function mat(color, opts) {
  const key = color + '|' + JSON.stringify(opts || {});
  if (matCache[key]) return matCache[key];
  const m = new THREE.MeshStandardMaterial(Object.assign({
    color: color,
    roughness: 0.92,
    metalness: 0.0,
    flatShading: true
  }, opts || {}));
  matCache[key] = m;
  return m;
}

const MAT = {
  ground:    mat(COL.ground),
  groundDark:mat(COL.groundDark),
  rock:      mat(COL.rock),
  rockDark:  mat(COL.rockDark),
  rockLight: mat(COL.rockLight),
  water:     mat(COL.water, { roughness: 0.35, metalness: 0.15 }),
  waterDeep: mat(COL.waterDeep, { roughness: 0.3, metalness: 0.2 }),
  wall:      mat(COL.wall),
  wallDark:  mat(COL.wallDark),
  wallLight: mat(COL.wallLight),
  tower:     mat(COL.tower),
  roof:      mat(COL.roof),
  roofDark:  mat(COL.roofDark),
  wood:      mat(COL.wood),
  woodDark:  mat(COL.woodDark),
  tent:      mat(COL.tent),
  tentAlt:   mat(COL.tentAlt),
  tentDark:  mat(COL.tentDark),
  soldier:   mat(COL.soldier),
  soldierAlt:mat(COL.soldierAlt),
  skin:      mat(COL.soldierSkin),
  tree:      mat(COL.tree),
  treeDark:  mat(COL.treeDark),
  treeLight: mat(COL.treeLight),
  trunk:     mat(COL.trunk),
  fire:      mat(COL.fire, { emissive: COL.fire, emissiveIntensity: 1.4, roughness: 0.6 }),
  fireCore:  mat(COL.fireCore, { emissive: COL.fireCore, emissiveIntensity: 2.0, roughness: 0.5 }),
  boulder:   mat(COL.boulder),
  boulderDark:mat(COL.boulderDark),
  dust:      mat(COL.dust, { transparent: true, opacity: 0.55, roughness: 1.0 }),
  rubble:    mat(COL.rubble),
  banner:    mat(COL.banner),
  bannerAlt: mat(COL.bannerAlt),
  gold:      mat(COL.gold, { roughness: 0.5, metalness: 0.4 })
};

/* ============================================================
   GEOMETRY HELPERS
   ============================================================ */

const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const prismGeo = (() => {
  // triangular prism (roof shape): width 1, height 1, depth 1
  const g = new THREE.BufferGeometry();
  const v = [
    // front face
    -0.5, 0, 0.5,  0.5, 0, 0.5,  0, 1, 0.5,
    // back face
    -0.5, 0, -0.5,  0, 1, -0.5,  0.5, 0, -0.5,
    // left slope
    -0.5, 0, 0.5,  0, 1, 0.5,  0, 1, -0.5,
    -0.5, 0, 0.5,  0, 1, -0.5,  -0.5, 0, -0.5,
    // right slope
    0.5, 0, 0.5,  0.5, 0, -0.5,  0, 1, -0.5,
    0.5, 0, 0.5,  0, 1, -0.5,  0, 1, 0.5,
    // bottom
    -0.5, 0, 0.5,  -0.5, 0, -0.5,  0.5, 0, -0.5,
    -0.5, 0, 0.5,  0.5, 0, -0.5,  0.5, 0, 0.5
  ];
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.computeVertexNormals();
  return g;
})();

function addBox(parent, w, h, d, x, y, z, material, castShadow, receiveShadow) {
  const m = new THREE.Mesh(boxGeo, material);
  m.scale.set(w, h, d);
  m.position.set(x, y, z);
  m.castShadow = castShadow !== false;
  m.receiveShadow = receiveShadow !== false;
  parent.add(m);
  return m;
}

function addPrism(parent, w, h, d, x, y, z, material, rotY) {
  const m = new THREE.Mesh(prismGeo, material);
  m.scale.set(w, h, d);
  m.position.set(x, y, z);
  if (rotY) m.rotation.y = rotY;
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ============================================================
   TERRAIN  (voxel-ish ground with hills, river channel)
   ============================================================ */

const terrainGroup = new THREE.Group();
scene.add(terrainGroup);

// Build a coarse voxel terrain: grid of blocks, height varies.
const TERRAIN = {
  cell: 4,
  nx: 66,
  nz: 66,
  originX: -132,
  originZ: -132
};

function terrainHeight(x, z) {
  // base rolling hills
  let h = 0;
  h += Math.sin(x * 0.045) * 3.2;
  h += Math.cos(z * 0.038) * 2.8;
  h += Math.sin((x + z) * 0.021) * 4.0;
  h += Math.cos((x - z) * 0.017) * 3.5;
  // mountainside rising behind castle (negative z)
  const back = Math.max(0, (-z - 20) / 100);
  h += back * back * 46;
  // valley flattening toward camp
  const front = Math.max(0, (z - 40) / 80);
  h -= front * front * 10;
  // river channel carve
  const dr = Math.abs(z - WORLD.riverZ);
  if (dr < WORLD.riverW * 0.5) {
    const t = 1 - dr / (WORLD.riverW * 0.5);
    h -= t * t * 7;
  }
  // castle plateau flatten
  const dcx = Math.abs(x - WORLD.castleX);
  const dcz = Math.abs(z - WORLD.castleZ);
  if (dcx < WORLD.castleW * 0.7 && dcz < WORLD.castleD * 0.7) {
    h = Math.min(h, 2);
  }
  return h;
}

// terrain instanced blocks
(function buildTerrain() {
  const { cell, nx, nz, originX, originZ } = TERRAIN;
  const count = nx * nz;
  const geo = new THREE.BoxGeometry(cell, 1, cell);
  const mesh = new THREE.InstancedMesh(geo, MAT.ground, count);
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  const dummy = new THREE.Object3D();
  const colorArr = new Float32Array(count * 3);
  const c = new THREE.Color();
  let i = 0;
  for (let ix = 0; ix < nx; ix++) {
    for (let iz = 0; iz < nz; iz++) {
      const x = originX + ix * cell + cell * 0.5;
      const z = originZ + iz * cell + cell * 0.5;
      const h = terrainHeight(x, z);
      // stack a few blocks to give voxel thickness
      const thickness = Math.max(1, Math.round(h + 6));
      dummy.position.set(x, h - thickness * 0.5 + 0.5, z);
      dummy.scale.set(1, thickness, 1);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      // colour variation
      const t = (Math.sin(x * 0.3) + Math.cos(z * 0.27)) * 0.5;
      c.setHex(COL.ground);
      c.offsetHSL(0, 0, t * 0.06);
      if (h > 18) c.setHex(COL.rock);
      else if (h > 10) c.lerp(new THREE.Color(COL.rockDark), 0.4);
      colorArr[i * 3] = c.r;
      colorArr[i * 3 + 1] = c.g;
      colorArr[i * 3 + 2] = c.b;
      i++;
    }
  }
  mesh.instanceColor = new THREE.InstancedBufferAttribute(colorArr, 3);
  mesh.instanceMatrix.needsUpdate = true;
  terrainGroup.add(mesh);
})();

// river water plane (voxel-ish strips)
(function buildRiver() {
  const waterGroup = new THREE.Group();
  const segs = 40;
  const len = WORLD.size;
  const step = len / segs;
  for (let i = 0; i < segs; i++) {
    const z = -WORLD.size * 0.5 + i * step + step * 0.5;
    const w = WORLD.riverW * (0.85 + 0.15 * Math.sin(i * 0.7));
    const h = terrainHeight(0, z);
    const waterY = Math.max(h + 1.2, -2.5);
    const m = new THREE.Mesh(boxGeo, i % 2 === 0 ? MAT.water : MAT.waterDeep);
    m.scale.set(w, 0.8, step * 1.02);
    m.position.set(Math.sin(i * 0.4) * 6, waterY, z);
    m.receiveShadow = true;
    waterGroup.add(m);
  }
  scene.add(waterGroup);
})();

/* ============================================================
   CASTLE  (voxel walls with destructible blocks)
   ============================================================ */

const castleGroup = new THREE.Group();
scene.add(castleGroup);

// wall block registry for destruction
const wallBlocks = [];   // { mesh, x, y, z, alive }
const wallBlockGeo = new THREE.BoxGeometry(WORLD.wallBlock, WORLD.wallBlock, WORLD.wallBlock);

function buildCastle() {
  const cx = WORLD.castleX;
  const cz = WORLD.castleZ;
  const W = WORLD.castleW;
  const D = WORLD.castleD;
  const H = WORLD.wallH;
  const B = WORLD.wallBlock;
  const baseY = 2;

  // ---- walls as individual blocks (front wall is the target) ----
  function buildWallLine(x0, z0, x1, z1) {
    const dx = x1 - x0;
    const dz = z1 - z0;
    const len = Math.sqrt(dx * dx + dz * dz);
    const steps = Math.round(len / B);
    const ux = dx / len;
    const uz = dz / len;
    for (let s = 0; s < steps; s++) {
      const bx = x0 + ux * (s * B + B * 0.5);
      const bz = z0 + uz * (s * B + B * 0.5);
      for (let layer = 0; layer < Math.round(H / B); layer++) {
        const by = baseY + layer * B + B * 0.5;
        // crenellation: skip top layer on alternating blocks
        if (layer === Math.round(H / B) - 1 && s % 2 === 1) continue;
        const m = new THREE.Mesh(wallBlockGeo, (layer % 2 === 0) ? MAT.wall : MAT.wallDark);
        m.position.set(bx, by, bz);
        m.castShadow = true;
        m.receiveShadow = true;
        castleGroup.add(m);
        wallBlocks.push({ mesh: m, x: bx, y: by, z: bz, alive: true });
      }
    }
  }

  // front wall (facing +z, toward camp) — the main target
  buildWallLine(cx - W * 0.5, cz + D * 0.5, cx + W * 0.5, cz + D * 0.5);
  // back wall
  buildWallLine(cx - W * 0.5, cz - D * 0.5, cx + W * 0.5, cz - D * 0.5);
  // left wall
  buildWallLine(cx - W * 0.5, cz - D * 0.5, cx - W * 0.5, cz + D * 0.5);
  // right wall
  buildWallLine(cx + W * 0.5, cz - D * 0.5, cx + W * 0.5, cz + D * 0.5);

  // ---- corner towers ----
  const towerPositions = [
    [cx - W * 0.5, cz + D * 0.5],
    [cx + W * 0.5, cz + D * 0.5],
    [cx - W * 0.5, cz - D * 0.5],
    [cx + W * 0.5, cz - D * 0.5]
  ];
  for (const [tx, tz] of towerPositions) {
    const towerH = H + 8;
    const tw = 8;
    // tower body
    addBox(castleGroup, tw, towerH, tw, tx, baseY + towerH * 0.5, tz, MAT.tower);
    // crenellations
    for (let i = 0; i < 4; i++) {
      const ang = i * Math.PI * 0.5;
      const ox = Math.cos(ang) * (tw * 0.5 - 0.8);
      const oz = Math.sin(ang) * (tw * 0.5 - 0.8);
      addBox(castleGroup, 1.6, 2.2, 1.6, tx + ox, baseY + towerH + 1.1, tz + oz, MAT.wallLight);
    }
    // roof prism
    addPrism(castleGroup, tw + 1, 5, tw + 1, tx, baseY + towerH + 2.2, tz, MAT.roof);
    // banner pole
    addBox(castleGroup, 0.4, 6, 0.4, tx, baseY + towerH + 7, tz, MAT.woodDark);
    addBox(castleGroup, 2.4, 1.6, 0.2, tx + 1.2, baseY + towerH + 8.6, tz, MAT.banner);
  }

  // ---- gatehouse ----
  const gateZ = cz + D * 0.5;
  addBox(castleGroup, 10, H + 6, 6, cx, baseY + (H + 6) * 0.5, gateZ, MAT.tower);
  addPrism(castleGroup, 11, 4, 7, cx, baseY + H + 6, gateZ, MAT.roofDark);
  // gate opening (dark box)
  addBox(castleGroup, 5, 8, 1, cx, baseY + 4, gateZ + 3.1, mat(0x1a1410), false, false);

  // ---- keep (central building) ----
  const keepW = 18;
  const keepH = 22;
  addBox(castleGroup, keepW, keepH, keepW, cx, baseY + keepH * 0.5, cz, MAT.wallLight);
  addPrism(castleGroup, keepW + 2, 8, keepW + 2, cx, baseY + keepH, cz, MAT.roof);
  // keep windows
  for (let i = 0; i < 3; i++) {
    addBox(castleGroup, 1.4, 2.2, 0.6, cx - 5 + i * 5, baseY + 14, cz + keepW * 0.5 + 0.3, mat(0x1a1410), false, false);
  }
  // keep banner
  addBox(castleGroup, 0.5, 10, 0.5, cx, baseY + keepH + 10, cz, MAT.woodDark);
  addBox(castleGroup, 3.2, 2, 0.2, cx + 1.6, baseY + keepH + 12, cz, MAT.bannerAlt);

  // ---- inner courtyard floor ----
  addBox(castleGroup, W - 4, 0.6, D - 4, cx, baseY + 0.3, cz, MAT.wallDark, false, true);

  // ---- small houses in courtyard ----
  for (let i = 0; i < 6; i++) {
    const hx = cx + rand(-W * 0.3, W * 0.3);
    const hz = cz + rand(-D * 0.3, D * 0.3);
    const hw = rand(3, 5);
    const hh = rand(3, 5);
    addBox(castleGroup, hw, hh, hw, hx, baseY + hh * 0.5, hz, MAT.wall);
    addPrism(castleGroup, hw + 0.6, 2.5, hw + 0.6, hx, baseY + hh, hz, MAT.roofDark);
  }
}
buildCastle();

/* ============================================================
   TREBUCHETS  (swinging arm + sling, fire boulders)
   ============================================================ */

const trebuchets = [];
const boulders = [];       // active boulder projectiles
const debris = [];         // falling wall blocks
const dustPuffs = [];      // dust cloud particles

function buildTrebuchet(x, z, facing) {
  const g = new THREE.Group();
  g.position.set(x, terrainHeight(x, z) + 0.5, z);
  g.rotation.y = facing;
  scene.add(g);

  // base frame
  addBox(g, TREB.baseW, TREB.baseH, TREB.baseD, 0, TREB.baseH * 0.5, 0, MAT.woodDark);
  // side supports (A-frame)
  addBox(g, 0.8, TREB.pivotH, 0.8, -TREB.baseW * 0.4, TREB.baseH + TREB.pivotH * 0.5, 0, MAT.wood);
  addBox(g, 0.8, TREB.pivotH, 0.8, TREB.baseW * 0.4, TREB.baseH + TREB.pivotH * 0.5, 0, MAT.wood);
  // cross beam
  addBox(g, TREB.baseW * 0.9, 0.8, 0.8, 0, TREB.baseH + TREB.pivotH, 0, MAT.wood);
  // wheels
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.6, 8), MAT.woodDark);
      wheel.rotation.z = Math.PI * 0.5;
      wheel.position.set(sx * TREB.baseW * 0.4, 1.2, sz * TREB.baseD * 0.35);
      wheel.castShadow = true;
      g.add(wheel);
    }
  }

  // arm pivot group
  const armPivot = new THREE.Group();
  armPivot.position.set(0, TREB.baseH + TREB.pivotH, 0);
  g.add(armPivot);

  // arm (long beam)
  const arm = new THREE.Mesh(boxGeo, MAT.wood);
  arm.scale.set(TREB.armThick, TREB.armLen, TREB.armThick);
  arm.position.set(0, TREB.armLen * 0.5 - TREB.armLen * 0.5, 0);
  // we'll orient arm along local Y, pivot at center offset
  arm.position.set(0, 0, 0);
  arm.castShadow = true;
  // Actually build arm as two segments: short (counterweight side) and long (sling side)
  const shortLen = TREB.armLen * 0.3;
  const longLen = TREB.armLen * 0.7;
  const shortArm = new THREE.Mesh(boxGeo, MAT.woodDark);
  shortArm.scale.set(TREB.armThick, shortLen, TREB.armThick);
  shortArm.position.set(0, -shortLen * 0.5, 0);
  shortArm.castShadow = true;
  armPivot.add(shortArm);

  const longArm = new THREE.Mesh(boxGeo, MAT.wood);
  longArm.scale.set(TREB.armThick, longLen, TREB.armThick);
  longArm.position.set(0, longLen * 0.5, 0);
  longArm.castShadow = true;
  armPivot.add(longArm);

  // counterweight box at short end
  const cw = new THREE.Mesh(boxGeo, MAT.rockDark);
  cw.scale.set(TREB.cwMass, TREB.cwMass, TREB.cwMass);
  cw.position.set(0, -shortLen - TREB.cwMass * 0.5, 0);
  cw.castShadow = true;
  armPivot.add(cw);

  // sling (small box at long end, will hold boulder)
  const sling = new THREE.Mesh(boxGeo, MAT.woodDark);
  sling.scale.set(0.6, 0.6, 0.6);
  sling.position.set(0, longLen + 0.5, 0);
  armPivot.add(sling);

  // boulder in sling (visual)
  const loadedBoulder = new THREE.Mesh(new THREE.DodecahedronGeometry(TREB.boulderR, 0), MAT.boulder);
  loadedBoulder.position.set(0, longLen + 1.5, 0);
  loadedBoulder.castShadow = true;
  armPivot.add(loadedBoulder);

  // rope lines (thin boxes)
  const rope1 = new THREE.Mesh(boxGeo, MAT.woodDark);
  rope1.scale.set(0.15, TREB.slingLen, 0.15);
  rope1.position.set(0, longLen + TREB.slingLen * 0.5, 0);
  armPivot.add(rope1);

  const treb = {
    group: g,
    armPivot: armPivot,
    loadedBoulder: loadedBoulder,
    sling: sling,
    rope1: rope1,
    x: x,
    z: z,
    facing: facing,
    timer: rand(0, TREB.cycleTime),
    state: 'idle',   // idle | falling | released
    armAngle: TREB.restAngle,
    armVel: 0,
    fired: false
  };
  trebuchets.push(treb);
  return treb;
}

/* ============================================================
   WALL DESTRUCTION
   ============================================================ */

function destroyWallBlocks(impactX, impactY, impactZ, radius) {
  let destroyed = 0;
  for (const wb of wallBlocks) {
    if (!wb.alive) continue;
    const dx = wb.x - impactX;
    const dy = wb.y - impactY;
    const dz = wb.z - impactZ;
    const d2 = dx * dx + dy * dy + dz * dz;
    if (d2 < radius * radius) {
      wb.alive = false;
      wb.mesh.visible = false;
      castleGroup.remove(wb.mesh);
      // spawn debris
      const deb = new THREE.Mesh(wallBlockGeo, (rng() < 0.5) ? MAT.rubble : MAT.wallDark);
      deb.position.set(wb.x, wb.y, wb.z);
      deb.castShadow = true;
      deb.receiveShadow = true;
      scene.add(deb);
      debris.push({
        mesh: deb,
        vx: rand(-6, 6) + (wb.x - impactX) * 0.8,
        vy: rand(2, 10),
        vz: rand(-6, 6) + (wb.z - impactZ) * 0.8,
        rx: rand(-4, 4),
        ry: rand(-4, 4),
        rz: rand(-4, 4),
        life: rand(2.5, 4.5),
        age: 0
      });
      destroyed++;
    }
  }
  if (destroyed > 0) {
    const total = wallBlocks.length;
    const alive = wallBlocks.filter(w => w.alive).length;
    hudState.wallPct = Math.round((alive / total) * 100);
  }
  return destroyed;
}

/* ============================================================
   CAMERA CONTROLS  (orbit + drag + wheel)
   ============================================================ */

const camState = {
  theta: 0.6,
  phi: 0.9,
  radius: CAM.orbitRadius,
  target: CAM.target.clone(),
  autoOrbit: true,
  dragging: false,
  lastX: 0,
  lastY: 0,
  autoTimer: 0
};

function updateCamera(dt) {
  if (camState.autoOrbit && !camState.dragging) {
    camState.theta += CAM.orbitSpeed * dt;
  }
  const sinPhi = Math.sin(camState.phi);
  const cosPhi = Math.cos(camState.phi);
  const sinTheta = Math.sin(camState.theta);
  const cosTheta = Math.cos(camState.theta);

  const r = camState.radius;
  const x = camState.target.x + r * sinPhi * sinTheta;
  const y = camState.target.y + r * cosPhi;
  const z = camState.target.z + r * sinPhi * cosTheta;

  camera.position.set(x, Math.max(y, CAM.minHeight), z);
  camera.lookAt(camState.target);
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  camState.dragging = true;
  camState.autoOrbit = false;
  camState.lastX = e.clientX;
  camState.lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!camState.dragging) return;
  const dx = e.clientX - camState.lastX;
  const dy = e.clientY - camState.lastY;
  camState.lastX = e.clientX;
  camState.lastY = e.clientY;
  camState.theta -= dx * 0.005;
  camState.phi = Math.max(0.15, Math.min(1.45, camState.phi - dy * 0.004));
});
renderer.domElement.addEventListener('pointerup', (e) => {
  camState.dragging = false;
  camState.autoTimer = 0;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (err) {}
});
renderer.domElement.addEventListener('pointercancel', () => {
  camState.dragging = false;
});
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  camState.radius = Math.max(CAM.minRadius, Math.min(CAM.maxRadius, camState.radius + e.deltaY * 0.08));
}, { passive: false });

/* ============================================================
   TREBUCHET ANIMATION & FIRING
   ============================================================ */

function updateTrebuchets(dt) {
  for (const t of trebuchets) {
    t.timer += dt;

    if (t.state === 'idle') {
      // cocked back, waiting
      t.armAngle = TREB.restAngle;
      t.armPivot.rotation.x = t.armAngle;
      t.loadedBoulder.visible = true;
      if (t.timer >= TREB.cycleTime) {
        t.state = 'falling';
        t.timer = 0;
        t.fired = false;
        t.armVel = 0;
      }
    } else if (t.state === 'falling') {
      // arm accelerates forward (falling)
      t.armVel += 6.0 * dt;
      t.armAngle -= t.armVel * dt;
      if (t.armAngle <= TREB.releaseAngle) {
        t.armAngle = TREB.releaseAngle;
        t.state = 'released';
        t.timer = 0;
        // fire boulder
        if (!t.fired) {
          t.fired = true;
          t.loadedBoulder.visible = false;
          // compute world position of sling tip
          const tipLocal = new THREE.Vector3(0, TREB.armLen * 0.7 + 1.5, 0);
          tipLocal.applyEuler(t.armPivot.rotation);
          tipLocal.add(t.armPivot.position);
          tipLocal.applyEuler(t.group.rotation);
          tipLocal.add(t.group.position);

          // velocity: forward and up, toward castle
          const dir = new THREE.Vector3(0, 0, -1);
          dir.applyEuler(t.group.rotation);
          const speed = rand(28, 34);
          const vx = dir.x * speed + rand(-1.5, 1.5);
          const vy = rand(18, 24);
          const vz = dir.z * speed + rand(-1.5, 1.5);
          spawnBoulder(tipLocal.x, tipLocal.y, tipLocal.z, vx, vy, vz);
        }
      }
      t.armPivot.rotation.x = t.armAngle;
    } else if (t.state === 'released') {
      // arm continues to swing down / settle
      t.armAngle -= t.armVel * dt * 0.5;
      t.armVel *= 0.92;
      if (t.armAngle < -1.4) t.armAngle = -1.4;
      t.armPivot.rotation.x = t.armAngle;
      if (t.timer > 1.5) {
        t.state = 'idle';
        t.timer = 0;
        t.armAngle = TREB.restAngle;
        t.armPivot.rotation.x = t.armAngle;
      }
    }
  }
}

/* ============================================================
   BOULDER PHYSICS & IMPACT
   ============================================================ */

function updateBoulders(dt) {
  for (let i = boulders.length - 1; i >= 0; i--) {
    const b = boulders[i];
    if (!b.alive) {
      scene.remove(b.mesh);
      boulders.splice(i, 1);
      continue;
    }
    b.vy += GRAV * dt;
    b.mesh.position.x += b.vx * dt;
    b.mesh.position.y += b.vy * dt;
    b.mesh.position.z += b.vz * dt;
    b.mesh.rotation.x += dt * 3;
    b.mesh.rotation.z += dt * 2;

    const px = b.mesh.position.x;
    const py = b.mesh.position.y;
    const pz = b.mesh.position.z;

    // check wall collision
    let hitWall = false;
    for (const wb of wallBlocks) {
      if (!wb.alive) continue;
      const dx = px - wb.x;
      const dy = py - wb.y;
      const dz = pz - wb.z;
      const d2 = dx * dx + dy * dy + dz * dz;
      const rr = TREB.boulderR + WORLD.wallBlock * 0.7;
      if (d2 < rr * rr) {
        hitWall = true;
        break;
      }
    }

    if (hitWall) {
      destroyWallBlocks(px, py, pz, 7.5);
      spawnDust(px, py, pz, 14, 3.5, 1.6);
      b.alive = false;
      continue;
    }

    // ground collision
    const gh = terrainHeight(px, pz);
    if (py <= gh + TREB.boulderR * 0.5) {
      spawnDust(px, gh + 0.5, pz, 10, 2.5, 1.2);
      // small chance to damage wall if near
      if (Math.abs(px - WORLD.castleX) < WORLD.castleW * 0.7 &&
          Math.abs(pz - WORLD.castleZ) < WORLD.castleD * 0.7) {
        destroyWallBlocks(px, py, pz, 5.0);
      }
      b.alive = false;
      continue;
    }

    // out of bounds
    if (py < -50 || Math.abs(px) > 200 || Math.abs(pz) > 200) {
      b.alive = false;
    }
  }
}

/* ============================================================
   DEBRIS PHYSICS
   ============================================================ */

function updateDebris(dt) {
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.age += dt;
    d.vy += GRAV * dt;
    d.mesh.position.x += d.vx * dt;
    d.mesh.position.y += d.vy * dt;
    d.mesh.position.z += d.vz * dt;
    d.mesh.rotation.x += d.rx * dt;
    d.mesh.rotation.y += d.ry * dt;
    d.mesh.rotation.z += d.rz * dt;

    const gh = terrainHeight(d.mesh.position.x, d.mesh.position.z);
    if (d.mesh.position.y < gh + WORLD.wallBlock * 0.5) {
      d.mesh.position.y = gh + WORLD.wallBlock * 0.5;
      d.vy *= -0.3;
      d.vx *= 0.6;
      d.vz *= 0.6;
      d.rx *= 0.5;
      d.ry *= 0.5;
      d.rz *= 0.5;
    }

    if (d.age > d.life) {
      scene.remove(d.mesh);
      debris.splice(i, 1);
    }
  }
}

/* ============================================================
   DUST PHYSICS
   ============================================================ */

function updateDust(dt) {
  for (let i = dustPuffs.length - 1; i >= 0; i--) {
    const p = dustPuffs[i];
    p.age += dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.vy -= 1.5 * dt;
    p.vx *= 0.97;
    p.vz *= 0.97;
    const t = p.age / p.life;
    const s = p.baseScale * (1 + t * 1.5);
    p.mesh.scale.set(s, s, s);
    p.mesh.material.opacity = 0.55 * (1 - t);
    if (p.age > p.life) {
      scene.remove(p.mesh);
      dustPuffs.splice(i, 1);
    }
  }
}

/* ============================================================
   CAMPFIRE FLICKER
   ============================================================ */

function updateCampfires(t) {
  for (const f of campfires) {
    const flick = 0.85 + 0.3 * Math.sin(t * 8 + f.phase) + 0.15 * Math.sin(t * 17 + f.phase * 2);
    f.flame.scale.set(0.8 * flick, 1.6 * flick, 0.8 * flick);
    f.flame.position.y = f.baseY + 0.1 * Math.sin(t * 6 + f.phase);
    f.core.scale.set(0.4 * flick, 1.0 * flick, 0.4 * flick);
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */

let lastTime = performance.now();
let elapsed = 0;

function animate(now) {
  requestAnimationFrame(animate);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > DT_CLAMP) dt = DT_CLAMP;
  if (dt < 0) dt = 0;
  elapsed += dt;

  updateTrebuchets(dt);
  updateBoulders(dt);
  updateDebris(dt);
  updateDust(dt);
  updateCampfires(elapsed);

  // auto-orbit resumes after 4s of no drag
  if (!camState.dragging && !camState.autoOrbit) {
    camState.autoTimer += dt;
    if (camState.autoTimer > 4) {
      camState.autoOrbit = true;
    }
  }

  updateCamera(dt);
  updateHUD();

  renderer.render(scene, camera);
}

/* ============================================================
   RESIZE
   ============================================================ */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   START
   ============================================================ */

updateHUD();
requestAnimationFrame(animate);
</script>
</body>
