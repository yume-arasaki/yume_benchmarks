<script>
"use strict";

/* ============================================================
   CONSTANTS & TABLES (declared at top)
   ============================================================ */
const SEED = 7;
const MEM_SIZE = 256;
const MAX_STEPS = 10000;
const WRAP = 2147483648;      // 2^31
const WRAP_MASK = 0xFFFFFFFF; // 32-bit mask
const DT_CLAMP = 1 / 30;

const OPCODES = ["PUSH","POP","DUP","ADD","SUB","MUL","LOAD","STORE","JNZ","OUT","HALT"];

const DEFAULT_SRC = [
  "; factorial of 5 -> 120",
  "PUSH 1        ; acc",
  "PUSH 5        ; n",
  "loop:",
  "  DUP",
  "  JNZ body",
  "  POP",
  "  HALT",
  "body:",
  "  DUP",
  "  PUSH 1",
  "  SUB         ; n-1",
  "  STORE 0     ; save n-1",
  "  MUL         ; acc*n",
  "  LOAD 0",
  "  JNZ loop",
  "  POP",
  "  OUT",
  "  HALT"
].join("\n");

/* ============================================================
   SEEDED PRNG (deterministic; no Math.random)
   ============================================================ */
function makePRNG(seed){
  let s = (seed >>> 0) || 1;
  return function(){
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}
const rng = makePRNG(SEED);

/* ============================================================
   ARITHMETIC WRAP AT 2^31
   ============================================================ */
function wrap31(v){
  // wrap into signed 32-bit range [-2^31, 2^31-1]
  v = v & WRAP_MASK;
  if (v >= WRAP) v -= 4294967296;
  return v;
}

/* ============================================================
   ASSEMBLER
   ============================================================ */
function assemble(src){
  if (typeof src !== "string") return { ok:false, error:"source must be a string" };
  const lines = src.split(/\r?\n/);
  const instructions = [];
  const labels = Object.create(null);
  const errors = [];

  // Pass 1: strip comments, find labels, collect instruction lines
  const raw = [];
  for (let i = 0; i < lines.length; i++){
    let line = lines[i];
    const ci = line.indexOf(";");
    if (ci >= 0) line = line.slice(0, ci);
    line = line.trim();
    if (line === "") continue;

    // label at line start: name:
    const lm = /^([A-Za-z_][A-Za-z0-9_]*):(.*)$/.exec(line);
    if (lm){
      const name = lm[1];
      if (name in labels){
        errors.push("line " + (i+1) + ": duplicate label '" + name + "'");
      } else {
        labels[name] = instructions.length;
      }
      line = lm[2].trim();
      if (line === "") continue;
    }
    raw.push({ line: line, srcLine: i+1 });
  }

  // Pass 2: parse instructions
  for (let k = 0; k < raw.length; k++){
    const item = raw[k];
    const parts = item.line.split(/\s+/);
    const op = parts[0].toUpperCase();
    const arg = parts.length > 1 ? parts[1] : null;
    const extra = parts.length > 2 ? parts.slice(2).join(" ") : null;

    if (OPCODES.indexOf(op) < 0){
      errors.push("line " + item.srcLine + ": unknown opcode '" + parts[0] + "'");
      continue;
    }
    if (extra !== null){
      errors.push("line " + item.srcLine + ": too many operands");
      continue;
    }

    const needsArg = (op === "PUSH" || op === "LOAD" || op === "STORE" || op === "JNZ");
    if (needsArg && arg === null){
      errors.push("line " + item.srcLine + ": " + op + " requires an operand");
      continue;
    }
    if (!needsArg && arg !== null){
      errors.push("line " + item.srcLine + ": " + op + " takes no operand");
      continue;
    }

    if (op === "PUSH" || op === "LOAD" || op === "STORE"){
      if (!/^-?\d+$/.test(arg)){
        errors.push("line " + item.srcLine + ": expected decimal integer, got '" + arg + "'");
        continue;
      }
      const n = parseInt(arg, 10);
      if (op === "LOAD" || op === "STORE"){
        if (n < 0 || n >= MEM_SIZE){
          errors.push("line " + item.srcLine + ": address " + n + " out of range [0," + (MEM_SIZE-1) + "]");
          continue;
        }
      }
      instructions.push({ op: op, arg: n, srcLine: item.srcLine });
    } else if (op === "JNZ"){
      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(arg)){
        errors.push("line " + item.srcLine + ": invalid label '" + arg + "'");
        continue;
      }
      instructions.push({ op: op, arg: arg, srcLine: item.srcLine });
    } else {
      instructions.push({ op: op, arg: null, srcLine: item.srcLine });
    }
  }

  // Resolve labels
  for (let k = 0; k < instructions.length; k++){
    const ins = instructions[k];
    if (ins.op === "JNZ"){
      if (!(ins.arg in labels)){
        errors.push("line " + ins.srcLine + ": undefined label '" + ins.arg + "'");
      } else {
        ins.target = labels[ins.arg];
      }
    }
  }

  if (errors.length){
    return { ok:false, error: errors.join(" | ") };
  }
  return { ok:true, instructions: instructions };
}

/* ============================================================
   VM CORE (headless; no DOM)
   ============================================================ */
function makeMachine(){
  return {
    mem: new Array(MEM_SIZE).fill(0),
    stack: [],
    pc: 0,
    steps: 0,
    status: "idle",
    output: [],
    error: null
  };
}

function cloneMachine(m){
  return {
    mem: m.mem.slice(),
    stack: m.stack.slice(),
    pc: m.pc,
    steps: m.steps,
    status: m.status,
    output: m.output.slice(),
    error: m.error
  };
}

// Execute exactly one instruction. Returns true if machine is still runnable.
function stepOnce(m, instructions){
  if (m.status !== "idle" && m.status !== "running") return false;
  if (m.pc < 0 || m.pc >= instructions.length){
    m.status = "error";
    m.error = "pc out of range";
    return false;
  }
  const ins = instructions[m.pc];
  m.steps++;
  let nextPc = m.pc + 1;

  switch (ins.op){
    case "PUSH":
      m.stack.push(wrap31(ins.arg));
      break;
    case "POP":
      if (m.stack.length === 0){ m.status = "error"; m.error = "pop on empty stack"; return false; }
      m.stack.pop();
      break;
    case "DUP":
      if (m.stack.length === 0){ m.status = "error"; m.error = "dup on empty stack"; return false; }
      m.stack.push(m.stack[m.stack.length - 1]);
      break;
    case "ADD": {
      if (m.stack.length < 2){ m.status = "error"; m.error = "add needs 2 operands"; return false; }
      const b = m.stack.pop(); const a = m.stack.pop();
      m.stack.push(wrap31(a + b));
      break;
    }
    case "SUB": {
      if (m.stack.length < 2){ m.status = "error"; m.error = "sub needs 2 operands"; return false; }
      const b = m.stack.pop(); const a = m.stack.pop();
      m.stack.push(wrap31(a - b));
      break;
    }
    case "MUL": {
      if (m.stack.length < 2){ m.status = "error"; m.error = "mul needs 2 operands"; return false; }
      const b = m.stack.pop(); const a = m.stack.pop();
      m.stack.push(wrap31(a * b));
      break;
    }
    case "LOAD":
      m.stack.push(wrap31(m.mem[ins.arg]));
      break;
    case "STORE":
      if (m.stack.length === 0){ m.status = "error"; m.error = "store on empty stack"; return false; }
      m.mem[ins.arg] = wrap31(m.stack.pop());
      break;
    case "JNZ": {
      if (m.stack.length === 0){ m.status = "error"; m.error = "jnz on empty stack"; return false; }
      const v = m.stack.pop();
      if (v !== 0) nextPc = ins.target;
      break;
    }
    case "OUT":
      if (m.stack.length === 0){ m.status = "error"; m.error = "out on empty stack"; return false; }
      m.output.push(m.stack.pop());
      break;
    case "HALT":
      m.status = "ok";
      m.pc = nextPc;
      return false;
    default:
      m.status = "error";
      m.error = "unknown opcode " + ins.op;
      return false;
  }

  m.pc = nextPc;
  if (m.steps >= MAX_STEPS){
    m.status = "halted-cap";
    return false;
  }
  return true;
}

function runProgram(src){
  const asm = assemble(src);
  if (!asm.ok){
    return { status:"error", output:[], regs:{pc:0, sp:0}, steps:0, error: asm.error };
  }
  const instructions = asm.instructions;
  const m = makeMachine();
  m.status = "running";
  let guard = 0;
  while (m.status === "running" && guard < MAX_STEPS + 2){
    guard++;
    const cont = stepOnce(m, instructions);
    if (!cont) break;
  }
  if (m.status === "running"){
    m.status = "halted-cap";
  }
  return {
    status: m.status,
    output: m.output.slice(),
    regs: { pc: m.pc, sp: m.stack.length },
    steps: m.steps,
    error: m.error
  };
}

/* ============================================================
   PUBLIC API (headless; must work before any click)
   ============================================================ */
window.API = {
  run: function(src){
    const r = runProgram(src);
    return {
      status: r.status,
      output: r.output,
      regs: r.regs,
      steps: r.steps
    };
  },
  assemble: function(src){
    const a = assemble(src);
    if (a.ok){
      return { ok:true, instructions: a.instructions.map(function(i){
        return { op: i.op, arg: i.arg, target: (i.target === undefined ? null : i.target), srcLine: i.srcLine };
      })};
    }
    return { ok:false, error: a.error };
  }
};

/* ============================================================
   SELF-TEST
   ============================================================ */
function __selftest(){
  const failures = [];
  let passed = 0;
  let total = 0;

  function check(name, cond, detail){
    total++;
    if (cond) passed++;
    else failures.push(name + (detail ? " :: " + detail : ""));
  }

  // 1. factorial 5 -> 120
  try {
    const src = [
      "PUSH 1",
      "PUSH 5",
      "loop:",
      "DUP",
      "JNZ body",
      "POP",
      "HALT",
      "body:",
      "DUP",
      "PUSH 1",
      "SUB",
      "STORE 0",
      "MUL",
      "LOAD 0",
      "JNZ loop",
      "POP",
      "OUT",
      "HALT"
    ].join("\n");
    const r = window.API.run(src);
    check("factorial5 status ok", r.status === "ok", "got " + r.status);
    check("factorial5 output 120", r.output.length === 1 && r.output[0] === 120, JSON.stringify(r.output));
  } catch(e){ check("factorial5 no throw", false, String(e)); }

  // 2. fibonacci 10 -> 55
  try {
    const src = [
      "PUSH 0",
      "PUSH 1",
      "PUSH 10",
      "loop:",
      "DUP",
      "JNZ body",
      "POP",
      "POP",
      "OUT",
      "HALT",
      "body:",
      "DUP",
      "PUSH 1",
      "SUB",
      "STORE 0",
      "POP",
      "DUP",
      "LOAD 1",
      "ADD",
      "STORE 2",
      "LOAD 1",
      "STORE 1",
      "LOAD 2",
      "STORE 0",
      "LOAD 0",
      "JNZ loop",
      "POP",
      "POP",
      "OUT",
      "HALT"
    ].join("\n");
    const r = window.API.run(src);
    check("fib10 status ok", r.status === "ok", "got " + r.status);
    check("fib10 output 55", r.output.length === 1 && r.output[0] === 55, JSON.stringify(r.output));
  } catch(e){ check("fib10 no throw", false, String(e)); }

  // 3. sum 1..10 -> 55
  try {
    const src = [
      "PUSH 0",
      "PUSH 10",
      "loop:",
      "DUP",
      "JNZ body",
      "POP",
      "OUT",
      "HALT",
      "body:",
      "DUP",
      "STORE 0",
      "ADD",
      "LOAD 0",
      "PUSH 1",
      "SUB",
      "JNZ loop",
      "POP",
      "OUT",
      "HALT"
    ].join("\n");
    const r = window.API.run(src);
    check("sum1to10 status ok", r.status === "ok", "got " + r.status);
    check("sum1to10 output 55", r.output.length === 1 && r.output[0] === 55, JSON.stringify(r.output));
  } catch(e){ check("sum1to10 no throw", false, String(e)); }

  // 4. pop on empty stack -> error, no throw
  try {
    const r = window.API.run("POP\nHALT");
    check("pop-empty status error", r.status === "error", "got " + r.status);
    check("pop-empty no throw", true);
  } catch(e){ check("pop-empty no throw", false, String(e)); }

  // 5. infinite loop -> halted-cap with exactly 10000 steps
  try {
    const src = [
      "PUSH 1",
      "loop:",
      "PUSH 1",
      "JNZ loop"
    ].join("\n");
    const r = window.API.run(src);
    check("infinite status halted-cap", r.status === "halted-cap", "got " + r.status);
    check("infinite steps 10000", r.steps === 10000, "got " + r.steps);
  } catch(e){ check("infinite no throw", false, String(e)); }

  // 6. assemble returns instructions
  try {
    const a = window.API.assemble("PUSH 1\nPUSH 2\nADD\nOUT\nHALT");
    check("assemble ok", a.ok === true);
    check("assemble count", a.ok && a.instructions.length === 5, a.ok ? String(a.instructions.length) : "n/a");
  } catch(e){ check("assemble no throw", false, String(e)); }

  return { passed: passed, total: total, failures: failures };
}
window.__selftest = __selftest;

/* ============================================================
   DOM / UI STATE
   ============================================================ */
const el = {
  editor: document.getElementById("editor"),
  gutter: document.getElementById("gutter"),
  hlLine: document.getElementById("hl-line"),
  btnRun: document.getElementById("btn-run"),
  btnStep: document.getElementById("btn-step"),
  btnReset: document.getElementById("btn-reset"),
  runStatus: document.getElementById("run-status"),
  hdrStatus: document.getElementById("hdr-status"),
  hdrSeed: document.getElementById("hdr-seed"),
  hdrSelftest: document.getElementById("hdr-selftest"),
  rPc: document.getElementById("r-pc"),
  rSp: document.getElementById("r-sp"),
  rSteps: document.getElementById("r-steps"),
  rStatus: document.getElementById("r-status"),
  stack: document.getElementById("stack"),
  mem: document.getElementById("mem"),
  out: document.getElementById("out")
};

const ui = {
  machine: makeMachine(),
  instructions: [],
  assembled: false,
  asmError: null,
  running: false,
  lastTime: 0,
  hlSrcLine: -1,
  log: []
};

/* ============================================================
   UI HELPERS
   ============================================================ */
function setStatusClass(node, status){
  node.classList.remove("ok","error","halted-cap");
  if (status === "ok") node.classList.add("ok");
  else if (status === "error") node.classList.add("error");
  else if (status === "halted-cap") node.classList.add("halted-cap");
}

function statusLabel(s){
  if (s === "ok") return "ok";
  if (s === "error") return "error";
  if (s === "halted-cap") return "halted-cap";
  if (s === "running") return "running";
  return "idle";
}

function updateGutter(){
  const lines = el.editor.value.split("\n");
  let g = "";
  for (let i = 0; i < lines.length; i++) g += (i+1) + "\n";
  el.gutter.textContent = g;
}

function updateHighlight(){
  const lineEl = el.hlLine;
  if (ui.hlSrcLine < 0){
    lineEl.style.display = "none";
    return;
  }
  const lh = 1.45 * 13; // line-height * font-size
  const top = 8 + (ui.hlSrcLine - 1) * lh;
  lineEl.style.display = "block";
  lineEl.style.top = top + "px";
  lineEl.style.height = lh + "px";
}

function renderRegs(){
  const m = ui.machine;
  el.rPc.textContent = String(m.pc);
  el.rSp.textContent = String(m.stack.length);
  el.rSteps.textContent = String(m.steps);
  el.rStatus.textContent = statusLabel(m.status);
}

function renderStack(){
  const m = ui.machine;
  const frag = document.createDocumentFragment();
  if (m.stack.length === 0){
    const d = document.createElement("div");
    d.className = "hint";
    d.textContent = "(empty)";
    frag.appendChild(d);
  } else {
    for (let i = 0; i < m.stack.length; i++){
      const row = document.createElement("div");
      row.className = "cell" + (i === m.stack.length - 1 ? " top" : "");
      const idx = document.createElement("span");
      idx.className = "idx";
      idx.textContent = "#" + i;
      const val = document.createElement("span");
      val.textContent = String(m.stack[i]);
      row.appendChild(idx);
      row.appendChild(val);
      frag.appendChild(row);
    }
  }
  el.stack.textContent = "";
  el.stack.appendChild(frag);
}

function renderMemory(){
  const m = ui.machine;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < MEM_SIZE; i++){
    const d = document.createElement("div");
    const v = m.mem[i];
    d.className = "m" + (v !== 0 ? " nz" : "");
    d.textContent = String(v);
    d.title = "[" + i + "] = " + v;
    frag.appendChild(d);
  }
  el.mem.textContent = "";
  el.mem.appendChild(frag);
}

function renderOutput(){
  el.out.textContent = "";
  const frag = document.createDocumentFragment();
  for (let i = 0; i < ui.log.length; i++){
    const entry = ui.log[i];
    const d = document.createElement("div");
    d.className = entry.kind;
    d.textContent = entry.text;
    frag.appendChild(d);
  }
  el.out.appendChild(frag);
  el.out.scrollTop = el.out.scrollHeight;
}

function renderAll(){
  renderRegs();
  renderStack();
  renderMemory();
  renderOutput();
  updateHighlight();
  const s = ui.machine.status;
  el.runStatus.textContent = statusLabel(s) + (ui.machine.error ? " · " + ui.machine.error : "");
  setStatusClass(el.runStatus, s);
  el.hdrStatus.textContent = statusLabel(s);
  setStatusClass(el.hdrStatus, s);
}

function logPush(kind, text){
  ui.log.push({ kind: kind, text: text });
  if (ui.log.length > 400) ui.log.splice(0, ui.log.length - 400);
}

/* ============================================================
   ASSEMBLY / RESET / RUN / STEP
   ============================================================ */
function doAssemble(){
  const a = assemble(el.editor.value);
  if (a.ok){
    ui.instructions = a.instructions;
    ui.assembled = true;
    ui.asmError = null;
    return true;
  }
  ui.instructions = [];
  ui.assembled = false;
  ui.asmError = a.error;
  return false;
}

function resetMachine(){
  ui.machine = makeMachine();
  ui.machine.status = "idle";
  ui.running = false;
  ui.hlSrcLine = -1;
  ui.log = [];
  logPush("i", "— reset —");
  renderAll();
}

function doReset(){
  doAssemble();
  resetMachine();
  if (ui.asmError){
    logPush("e", "asm error: " + ui.asmError);
    renderOutput();
  }
}

function doRun(){
  doAssemble();
  if (!ui.assembled){
    ui.machine = makeMachine();
    ui.machine.status = "error";
    ui.machine.error = ui.asmError || "assembly failed";
    ui.hlSrcLine = -1;
    logPush("e", "asm error: " + ui.machine.error);
    renderAll();
    return;
  }
  resetMachine();
  ui.machine.status = "running";
  ui.running = true;
  ui.lastTime = 0;
  logPush("i", "— run —");
  renderAll();
}

function doStep(){
  if (!ui.assembled){
    doAssemble();
    if (!ui.assembled){
      ui.machine = makeMachine();
      ui.machine.status = "error";
      ui.machine.error = ui.asmError || "assembly failed";
      logPush("e", "asm error: " + ui.machine.error);
      renderAll();
      return;
    }
  }
  if (ui.machine.status === "idle"){
    ui.machine.status = "running";
  }
  if (ui.machine.status !== "running"){
    // finished; restart from scratch for a fresh step
    resetMachine();
    ui.machine.status = "running";
  }
  const before = ui.machine.pc;
  const cont = stepOnce(ui.machine, ui.instructions);
  if (ui.machine.pc < ui.instructions.length && ui.machine.pc >= 0){
    ui.hlSrcLine = ui.instructions[ui.machine.pc].srcLine;
  } else {
    ui.hlSrcLine = -1;
  }
  if (ui.machine.status === "ok"){
    logPush("i", "halted ok after " + ui.machine.steps + " steps");
  } else if (ui.machine.status === "error"){
    logPush("e", "error: " + ui.machine.error);
  } else if (ui.machine.status === "halted-cap"){
    logPush("e", "halted-cap at " + ui.machine.steps + " steps");
  }
  renderAll();
  return cont;
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
function tick(now){
  requestAnimationFrame(tick);
  if (!ui.running) return;
  if (ui.lastTime === 0){ ui.lastTime = now; return; }
  let dt = (now - ui.lastTime) / 1000;
  ui.lastTime = now;
  if (dt > DT_CLAMP) dt = DT_CLAMP;
  if (dt < 0) dt = 0;

  // deterministic pacing: run a fixed number of instructions per frame
  const perFrame = 1 + Math.floor(rng() * 3); // 1..3, seeded
  let executed = 0;
  while (executed < perFrame && ui.machine.status === "running"){
    const cont = stepOnce(ui.machine, ui.instructions);
    executed++;
    if (ui.machine.pc >= 0 && ui.machine.pc < ui.instructions.length){
      ui.hlSrcLine = ui.instructions[ui.machine.pc].srcLine;
    } else {
      ui.hlSrcLine = -1;
    }
    if (!cont) break;
  }
  if (ui.machine.status !== "running"){
    ui.running = false;
    if (ui.machine.status === "ok") logPush("i", "halted ok after " + ui.machine.steps + " steps");
    else if (ui.machine.status === "error") logPush("e", "error: " + ui.machine.error);
    else if (ui.machine.status === "halted-cap") logPush("e", "halted-cap at " + ui.machine.steps + " steps");
  }
  renderAll();
}

/* ============================================================
   EVENTS
   ============================================================ */
el.editor.addEventListener("input", function(){
  updateGutter();
  doAssemble();
  if (ui.asmError){
    el.runStatus.textContent = "asm error";
    el.runStatus.classList.remove("ok","halted-cap");
    el.runStatus.classList.add("error");
  }
});

el.editor.addEventListener("scroll", function(){
  el.gutter.scrollTop = el.editor.scrollTop;
  updateHighlight();
});

el.btnRun.addEventListener("click", doRun);
el.btnStep.addEventListener("click", doStep);
el.btnReset.addEventListener("click", doReset);

window.addEventListener("resize", function(){
  updateGutter();
  updateHighlight();
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  el.hdrSeed.textContent = String(SEED);
  el.editor.value = DEFAULT_SRC;
  updateGutter();
  doAssemble();
  resetMachine();

  const st = __selftest();
  el.hdrSelftest.innerHTML = "SELFTEST <b>" + st.passed + "/" + st.total + "</b>";
  el.hdrSelftest.classList.remove("ok","bad");
  if (st.passed === st.total) el.hdrSelftest.classList.add("ok");
  else el.hdrSelftest.classList.add("bad");
  if (st.failures.length){
    for (let i = 0; i < st.failures.length; i++) logPush("e", "selftest: " + st.failures[i]);
  }
  renderOutput();
  requestAnimationFrame(tick);
}

if (document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</body>
</html>
