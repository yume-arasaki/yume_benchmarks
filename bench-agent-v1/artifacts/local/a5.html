<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathfinding Sandbox</title>
<style>
  :root{
    --bg:#0b0e13;
    --panel:#121722;
    --line:#1e2634;
    --text:#c9d4e3;
    --dim:#6b7a90;
    --accent:#39d0ff;
    --path:#ffe14d;
    --start:#3ddc84;
    --goal:#ff5c7a;
    --visited:#1b3a52;
    --frontier:#2a6f8f;
    --wall:#05070a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
    font-size:13px;letter-spacing:.5px;
  }
  header .title{color:var(--accent);font-weight:700;}
  header .stat{color:var(--dim);}
  header .stat b{color:var(--text);font-weight:600;}
  header .spacer{flex:1;}
  button{
    background:#1a2230;color:var(--text);border:1px solid var(--line);
    padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px;
  }
  button:hover{background:#22303f;border-color:#2f4055;}
  button:active{transform:translateY(1px);}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0;}
  canvas{display:block;background:var(--wall);border:1px solid var(--line);border-radius:4px;
    image-rendering:pixelated;max-width:100%;max-height:100%;}
  footer{padding:6px 16px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);
    background:var(--panel);display:flex;gap:18px;flex-wrap:wrap;}
  footer b{color:var(--text);}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">GRID · 40×40</span>
    <span class="stat">COST <b id="hCost">–</b></span>
    <span class="stat">NODES <b id="hNodes">0</b></span>
    <span class="stat">SELFTEST <b id="hSelf">–</b></span>
    <span class="spacer"></span>
    <button id="btnRegen">Regenerate</button>
    <button id="btnRun">Run</button>
    <button id="btnClear">Clear</button>
  </header>
  <main><canvas id="cv"></canvas></main>
  <footer>
    <span>Click: set <b>start</b></span>
    <span>Shift-click: set <b>goal</b></span>
    <span>Status: <b id="fStatus">idle</b></span>
    <span>Frontier: <b id="fFront">0</b></span>
    <span>Visited: <b id="fVis">0</b></span>
    <span>Seed: <b id="fSeed">–</b></span>
  </footer>
</div>
<script>
"use strict";

/* ============================================================
   CONSTANTS & TABLES (all declared at top)
   ============================================================ */
const SEED = 1337;
const ROWS = 40;
const COLS = 40;
const MIN_COST = 1;
const MAX_COST = 9;
const WALL = 0;
const WALL_CHANCE = 0.18;
const EXPANSIONS_PER_FRAME = 220;
const DT_CLAMP = 1 / 30;
const CELL_MIN = 8;
const CELL_MAX = 22;
const PAD = 1;

const DIRS = [
  [-1, 0],
  [ 1, 0],
  [ 0,-1],
  [ 0, 1]
];

const COLORS = {
  bg:      "#05070a",
  grid:    "#0e141d",
  wall:    "#05070a",
  visited: "#1b3a52",
  frontier:"#2a6f8f",
  path:    "#ffe14d",
  start:   "#3ddc84",
  goal:    "#ff5c7a",
  text:    "#c9d4e3"
};

/* ============================================================
   SEEDED PRNG (mulberry32) — deterministic, no Math.random
   ============================================================ */
function makePRNG(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================
   MIN-HEAP (binary) for A* open set
   ============================================================ */
class MinHeap {
  constructor() {
    this.items = [];
  }
  size() { return this.items.length; }
  push(node) {
    const a = this.items;
    a.push(node);
    let i = a.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (a[p].f <= a[i].f) break;
      const tmp = a[p]; a[p] = a[i]; a[i] = tmp;
      i = p;
    }
  }
  pop() {
    const a = this.items;
    if (a.length === 0) return null;
    const top = a[0];
    const last = a.pop();
    if (a.length > 0) {
      a[0] = last;
      let i = 0;
      const n = a.length;
      for (;;) {
        const l = 2 * i + 1;
        const r = 2 * i + 2;
        let m = i;
        if (l < n && a[l].f < a[m].f) m = l;
        if (r < n && a[r].f < a[m].f) m = r;
        if (m === i) break;
        const tmp = a[m]; a[m] = a[i]; a[i] = tmp;
        i = m;
      }
    }
    return top;
  }
}

/* ============================================================
   HEURISTIC — admissible for cost model (min entry cost = 1)
   Manhattan distance * MIN_COST
   ============================================================ */
function heuristic(r, c, gr, gc) {
  return (Math.abs(r - gr) + Math.abs(c - gc)) * MIN_COST;
}

/* ============================================================
   CORE A* — pure, no DOM. Returns {ok, cost, path}
   ============================================================ */
function astar(grid, start, goal) {
  const rows = grid.length;
  if (rows === 0) return { ok: false };
  const cols = grid[0].length;

  const sr = start[0], sc = start[1];
  const gr = goal[0], gc = goal[1];

  // Bounds / wall checks
  if (sr < 0 || sr >= rows || sc < 0 || sc >= cols) return { ok: false };
  if (gr < 0 || gr >= rows || gc < 0 || gc >= cols) return { ok: false };
  if (grid[sr][sc] === WALL) return { ok: false };
  if (grid[gr][gc] === WALL) return { ok: false };

  const N = rows * cols;
  const gScore = new Float64Array(N).fill(Infinity);
  const cameFrom = new Int32Array(N).fill(-1);
  const closed = new Uint8Array(N);

  const startIdx = sr * cols + sc;
  const goalIdx = gr * cols + gc;

  gScore[startIdx] = 0;
  const open = new MinHeap();
  open.push({ idx: startIdx, f: heuristic(sr, sc, gr, gc) });

  let expanded = 0;

  while (open.size() > 0) {
    const cur = open.pop();
    const idx = cur.idx;
    if (closed[idx]) continue;
    closed[idx] = 1;
    expanded++;

    if (idx === goalIdx) {
      // Reconstruct
      const path = [];
      let p = goalIdx;
      while (p !== -1) {
        path.push([Math.floor(p / cols), p % cols]);
        p = cameFrom[p];
      }
      path.reverse();
      // Cost = sum of entered cells (exclude start)
      let cost = 0;
      for (let i = 1; i < path.length; i++) {
        cost += grid[path[i][0]][path[i][1]];
      }
      return { ok: true, cost: cost, path: path };
    }

    const cr = Math.floor(idx / cols);
    const cc = idx % cols;
    const g = gScore[idx];

    for (let d = 0; d < DIRS.length; d++) {
      const nr = cr + DIRS[d][0];
      const nc = cc + DIRS[d][1];
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      const nIdx = nr * cols + nc;
      if (closed[nIdx]) continue;
      const cellCost = grid[nr][nc];
      if (cellCost === WALL) continue;
      const tentative = g + cellCost;
      if (tentative < gScore[nIdx]) {
        gScore[nIdx] = tentative;
        cameFrom[nIdx] = idx;
        const f = tentative + heuristic(nr, nc, gr, gc);
        open.push({ idx: nIdx, f: f });
      }
    }
  }

  return { ok: false };
}

/* ============================================================
   PUBLIC API
   ============================================================ */
window.API = {
  path: function (grid, start, goal) {
    return astar(grid, start, goal);
  }
};

/* ============================================================
   SELF-TEST
   ============================================================ */
function __selftest() {
  const failures = [];
  let passed = 0;
  let total = 0;

  function check(name, cond) {
    total++;
    if (cond) passed++;
    else failures.push(name);
  }

  // Map 1: optimal cost 4
  // 3x3, start [0,0], goal [0,2], all cost 1 except a wall detour
  // Straight line: enter [0,1]=1, [0,2]=1 => cost 2? Need cost 4.
  // Let's design: start [0,0], goal [2,2], costs such that optimal = 4.
  // Path: [0,0]->[0,1](1)->[1,1](1)->[2,1](1)->[2,2](1) = 4
  const map1 = [
    [1, 1, 9],
    [9, 1, 9],
    [9, 1, 1]
  ];
  const r1 = astar(map1, [0,0], [2,2]);
  check("map1 ok", r1.ok === true);
  check("map1 cost 4", r1.ok && r1.cost === 4);

  // Map 2: optimal cost 7
  // 3x3: start [0,0], goal [2,2]
  // Path [0,0]->[0,1](2)->[1,1](1)->[2,1](2)->[2,2](2) = 7
  const map2 = [
    [1, 2, 9],
    [9, 1, 9],
    [9, 2, 2]
  ];
  const r2 = astar(map2, [0,0], [2,2]);
  check("map2 ok", r2.ok === true);
  check("map2 cost 7", r2.ok && r2.cost === 7);

  // Map 3: optimal cost 12
  // 4x4: start [0,0], goal [3,3]
  // Path [0,0]->[0,1](3)->[1,1](3)->[2,1](3)->[3,1](3)->[3,2](0? no)
  // Let's do: [0,0]->[1,0](3)->[2,0](3)->[3,0](3)->[3,1](3)->[3,2](0? no)
  // Simpler: costs 3 each along a 4-step path = 12
  // [0,0]->[0,1](3)->[0,2](3)->[1,2](3)->[2,2](3)->[3,2](3)? that's 5 steps=15
  // 4 steps of 3 = 12: [0,0]->[1,0](3)->[2,0](3)->[3,0](3)->[3,1](3) = 12
  const map3 = [
    [1, 9, 9, 9],
    [3, 9, 9, 9],
    [3, 9, 9, 9],
    [3, 3, 9, 1]
  ];
  const r3 = astar(map3, [0,0], [3,1]);
  check("map3 ok", r3.ok === true);
  check("map3 cost 12", r3.ok && r3.cost === 12);

  // Walled-off goal
  const mapWall = [
    [1, 0, 1],
    [1, 0, 1],
    [1, 0, 1]
  ];
  const rw = astar(mapWall, [0,0], [0,2]);
  check("walled ok:false", rw.ok === false);

  // Path validity checks on map1
  if (r1.ok) {
    const p = r1.path;
    check("path starts at start", p[0][0] === 0 && p[0][1] === 0);
    check("path ends at goal", p[p.length-1][0] === 2 && p[p.length-1][1] === 2);
    let connected = true;
    for (let i = 1; i < p.length; i++) {
      const dr = Math.abs(p[i][0] - p[i-1][0]);
      const dc = Math.abs(p[i][1] - p[i-1][1]);
      if (dr + dc !== 1) connected = false;
    }
    check("path 4-connected", connected);
    let noWall = true;
    for (let i = 0; i < p.length; i++) {
      if (map1[p[i][0]][p[i][1]] === WALL) noWall = false;
    }
    check("path avoids walls", noWall);
    let sum = 0;
    for (let i = 1; i < p.length; i++) sum += map1[p[i][0]][p[i][1]];
    check("cost equals sum of entered", sum === r1.cost);
  }

  // Determinism
  const d1 = astar(map2, [0,0], [2,2]);
  const d2 = astar(map2, [0,0], [2,2]);
  check("determinism cost", d1.ok && d2.ok && d1.cost === d2.cost);

  return { passed: passed, total: total, failures: failures };
}

window.__selftest = __selftest;

/* ============================================================
   DOM / RENDER STATE
   ============================================================ */
const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");
const hCost = document.getElementById("hCost");
const hNodes = document.getElementById("hNodes");
const hSelf = document.getElementById("hSelf");
const fStatus = document.getElementById("fStatus");
const fFront = document.getElementById("fFront");
const fVis = document.getElementById("fVis");
const fSeed = document.getElementById("fSeed");
const btnRegen = document.getElementById("btnRegen");
const btnRun = document.getElementById("btnRun");
const btnClear = document.getElementById("btnClear");

let cellSize = 16;
let grid = [];
let start = [0, 0];
let goal = [ROWS - 1, COLS - 1];

// Search animation state
let search = null; // { open, gScore, cameFrom, closed, expanded, done, result, startIdx, goalIdx }
let visitedSet = null;
let frontierSet = null;
let finalPath = null;
let finalCost = null;
let nodeCount = 0;

let lastTime = 0;
let rafId = 0;

/* ============================================================
   TERRAIN GENERATION (seeded)
   ============================================================ */
function generateGrid(seed) {
  const rng = makePRNG(seed);
  const g = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      if (rng() < WALL_CHANCE) {
        row.push(WALL);
      } else {
        row.push(MIN_COST + Math.floor(rng() * (MAX_COST - MIN_COST + 1)));
      }
    }
    g.push(row);
  }
  // Ensure start and goal are not walls
  g[start[0]][start[1]] = MIN_COST + Math.floor(rng() * (MAX_COST - MIN_COST + 1));
  g[goal[0]][goal[1]] = MIN_COST + Math.floor(rng() * (MAX_COST - MIN_COST + 1));
  return g;
}

/* ============================================================
   SEARCH INITIALIZATION (incremental)
   ============================================================ */
function initSearch() {
  const rows = grid.length;
  const cols = grid[0].length;
  const sr = start[0], sc = start[1];
  const gr = goal[0], gc = goal[1];

  if (grid[sr][sc] === WALL || grid[gr][gc] === WALL) {
    search = {
      done: true,
      result: { ok: false },
      expanded: 0
    };
    visitedSet = new Set();
    frontierSet = new Set();
    finalPath = null;
    finalCost = null;
    nodeCount = 0;
    return;
  }

  const N = rows * cols;
  const gScore = new Float64Array(N).fill(Infinity);
  const cameFrom = new Int32Array(N).fill(-1);
  const closed = new Uint8Array(N);
  const startIdx = sr * cols + sc;
  const goalIdx = gr * cols + gc;

  gScore[startIdx] = 0;
  const open = new MinHeap();
  open.push({ idx: startIdx, f: heuristic(sr, sc, gr, gc) });

  search = {
    open: open,
    gScore: gScore,
    cameFrom: cameFrom,
    closed: closed,
    expanded: 0,
    done: false,
    result: null,
    startIdx: startIdx,
    goalIdx: goalIdx,
    rows: rows,
    cols: cols
  };
  visitedSet = new Set();
  frontierSet = new Set([startIdx]);
  finalPath = null;
  finalCost = null;
  nodeCount = 0;
}

/* ============================================================
   INCREMENTAL STEP
   ============================================================ */
function stepSearch() {
  if (!search || search.done) return;

  const s = search;
  const rows = s.rows;
  const cols = s.cols;
  const gr = goal[0], gc = goal[1];

  let steps = 0;
  while (steps < EXPANSIONS_PER_FRAME && s.open.size() > 0) {
    const cur = s.open.pop();
    const idx = cur.idx;
    if (s.closed[idx]) continue;
    s.closed[idx] = 1;
    s.expanded++;
    steps++;
    nodeCount = s.expanded;

    visitedSet.add(idx);
    frontierSet.delete(idx);

    if (idx === s.goalIdx) {
      // Reconstruct
      const path = [];
      let p = s.goalIdx;
      while (p !== -1) {
        path.push([Math.floor(p / cols), p % cols]);
        p = s.cameFrom[p];
      }
      path.reverse();
      let cost = 0;
      for (let i = 1; i < path.length; i++) {
        cost += grid[path[i][0]][path[i][1]];
      }
      s.result = { ok: true, cost: cost, path: path };
      s.done = true;
      finalPath = path;
      finalCost = cost;
      return;
    }

    const cr = Math.floor(idx / cols);
    const cc = idx % cols;
    const g = s.gScore[idx];

    for (let d = 0; d < DIRS.length; d++) {
      const nr = cr + DIRS[d][0];
      const nc = cc + DIRS[d][1];
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      const nIdx = nr * cols + nc;
      if (s.closed[nIdx]) continue;
      const cellCost = grid[nr][nc];
      if (cellCost === WALL) continue;
      const tentative = g + cellCost;
      if (tentative < s.gScore[nIdx]) {
        s.gScore[nIdx] = tentative;
        s.cameFrom[nIdx] = idx;
        const f = tentative + heuristic(nr, nc, gr, gc);
        s.open.push({ idx: nIdx, f: f });
        frontierSet.add(nIdx);
      }
    }
  }

  if (s.open.size() === 0 && !s.done) {
    s.result = { ok: false };
    s.done = true;
    finalPath = null;
    finalCost = null;
  }
}

/* ============================================================
   RENDERING
   ============================================================ */
function resize() {
  const main = canvas.parentElement;
  const availW = main.clientWidth - PAD * 2;
  const availH = main.clientHeight - PAD * 2;
  const maxCell = Math.floor(Math.min(availW / COLS, availH / ROWS));
  cellSize = Math.max(CELL_MIN, Math.min(CELL_MAX, maxCell));
  const w = cellSize * COLS;
  const h = cellSize * ROWS;
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, w, h);

  const cs = cellSize;

  // Draw cells
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * cs;
      const y = r * cs;
      const val = grid[r][c];
      const idx = r * COLS + c;

      if (val === WALL) {
        ctx.fillStyle = COLORS.wall;
        ctx.fillRect(x, y, cs, cs);
        continue;
      }

      // Base terrain shade based on cost
      const t = (val - MIN_COST) / (MAX_COST - MIN_COST);
      const shade = Math.floor(18 + t * 40);
      ctx.fillStyle = "rgb(" + shade + "," + (shade + 4) + "," + (shade + 10) + ")";
      ctx.fillRect(x, y, cs, cs);

      // Overlays
      if (visitedSet && visitedSet.has(idx)) {
        ctx.fillStyle = COLORS.visited;
        ctx.globalAlpha = 0.75;
        ctx.fillRect(x, y, cs, cs);
        ctx.globalAlpha = 1;
      } else if (frontierSet && frontierSet.has(idx)) {
        ctx.fillStyle = COLORS.frontier;
        ctx.globalAlpha = 0.8;
        ctx.fillRect(x, y, cs, cs);
        ctx.globalAlpha = 1;
      }

      // Grid line
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, cs - 1, cs - 1);
    }
  }

  // Final path
  if (finalPath && finalPath.length > 1) {
    ctx.strokeStyle = COLORS.path;
    ctx.lineWidth = Math.max(2, cs * 0.25);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (let i = 0; i < finalPath.length; i++) {
      const px = finalPath[i][1] * cs + cs / 2;
      const py = finalPath[i][0] * cs + cs / 2;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  // Start marker
  drawMarker(start[0], start[1], COLORS.start);
  // Goal marker
  drawMarker(goal[0], goal[1], COLORS.goal);
}

function drawMarker(r, c, color) {
  const cs = cellSize;
  const x = c * cs;
  const y = r * cs;
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.arc(x + cs / 2, y + cs / 2, Math.max(2, cs * 0.32), 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(x + cs / 2, y + cs / 2, Math.max(2, cs * 0.32), 0, Math.PI * 2);
  ctx.stroke();
}

/* ============================================================
   HEADER / FOOTER UPDATES
   ============================================================ */
function updateHeader() {
  hCost.textContent = (finalCost !== null) ? String(finalCost) : "–";
  hNodes.textContent = String(nodeCount);
  fFront.textContent = String(frontierSet ? frontierSet.size : 0);
  fVis.textContent = String(visitedSet ? visitedSet.size : 0);
  fSeed.textContent = String(SEED);
}

function updateStatus() {
  if (!search) {
    fStatus.textContent = "idle";
  } else if (search.done) {
    if (search.result && search.result.ok) {
      fStatus.textContent = "found (cost " + search.result.cost + ")";
    } else {
      fStatus.textContent = "unreachable (ok:false)";
    }
  } else {
    fStatus.textContent = "searching…";
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
function loop(now) {
  rafId = requestAnimationFrame(loop);
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > DT_CLAMP) dt = DT_CLAMP;

  if (search && !search.done) {
    stepSearch();
  }

  draw();
  updateHeader();
  updateStatus();
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function canvasToCell(evt) {
  const rect = canvas.getBoundingClientRect();
  const x = evt.clientX - rect.left;
  const y = evt.clientY - rect.top;
  const c = Math.floor(x / cellSize);
  const r = Math.floor(y / cellSize);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  return [r, c];
}

canvas.addEventListener("click", function (evt) {
  const cell = canvasToCell(evt);
  if (!cell) return;
  if (evt.shiftKey) {
    goal = cell;
  } else {
    start = cell;
  }
  // Reset search on new endpoints
  search = null;
  visitedSet = null;
  frontierSet = null;
  finalPath = null;
  finalCost = null;
  nodeCount = 0;
  initSearch();
});

btnRegen.addEventListener("click", function () {
  grid = generateGrid(SEED);
  search = null;
  visitedSet = null;
  frontierSet = null;
  finalPath = null;
  finalCost = null;
  nodeCount = 0;
  initSearch();
});

btnRun.addEventListener("click", function () {
  if (!search || search.done) {
    initSearch();
  }
});

btnClear.addEventListener("click", function () {
  search = null;
  visitedSet = null;
  frontierSet = null;
  finalPath = null;
  finalCost = null;
  nodeCount = 0;
});

window.addEventListener("resize", function () {
  resize();
  draw();
});

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  // Run self-test
  const st = __selftest();
  hSelf.textContent = st.passed + "/" + st.total;

  // Generate terrain
  grid = generateGrid(SEED);

  // Default start/goal
  start = [0, 0];
  goal = [ROWS - 1, COLS - 1];

  // Ensure endpoints are walkable
  if (grid[start[0]][start[1]] === WALL) grid[start[0]][start[1]] = 1;
  if (grid[goal[0]][goal[1]] === WALL) grid[goal[0]][goal[1]] = 1;

  resize();
  initSearch();

  lastTime = 0;
  rafId = requestAnimationFrame(loop);
}

boot();
</script>
</body>
</html>
