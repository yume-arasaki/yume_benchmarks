<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>City Simulator — Cutaway</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.55; color: #d8e6ff;
    background: rgba(8, 12, 20, 0.55);
    border: 1px solid rgba(120, 170, 255, 0.25);
    border-radius: 6px; padding: 10px 14px;
    letter-spacing: 0.06em; text-shadow: 0 0 6px rgba(90, 150, 255, 0.35);
    pointer-events: none; user-select: none;
  }
  #hud .k { color: #7fb2ff; }
  #hud .v { color: #eaf3ff; }
  #hud .sep { color: rgba(120, 170, 255, 0.35); }
</style>
</head>
<body>
<div id="hud"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONSTANTS & TABLES (all declared up front)
   ============================================================ */
const SEED = 1337;

// Seeded PRNG (mulberry32)
function makePRNG(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = makePRNG(SEED);
const rand = (a, b) => a + (b - a) * rng();
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length)];

// World layout
const FLOOR_H = 3.0;            // height of one storey
const BUILD_W = 14.0;           // building width (x)
const BUILD_D = 10.0;           // building depth (z)
const STREET_Y = 0.0;
const LOBBY_H = FLOOR_H;
const MALL_H = FLOOR_H * 1.35;
const RES_FLOORS = 3;
const OFFICE_FLOORS = 3;
const PENTHOUSE_H = FLOOR_H * 1.2;

// Floor y-levels (bottom of each floor)
const Y_LOBBY = STREET_Y;
const Y_MALL = Y_LOBBY + LOBBY_H;
const Y_RES0 = Y_MALL + MALL_H;
const Y_RES_TOP = Y_RES0 + RES_FLOORS * FLOOR_H;
const Y_OFF0 = Y_RES_TOP;
const Y_OFF_TOP = Y_OFF0 + OFFICE_FLOORS * FLOOR_H;
const Y_PENT = Y_OFF_TOP;
const Y_ROOF = Y_PENT + PENTHOUSE_H;
const TOTAL_H = Y_ROOF;

// Lift shafts (x positions), stairwell
const LIFT_X = [-4.2, 4.2];
const LIFT_W = 1.6;
const STAIR_X = 6.6;
const STAIR_W = 1.4;

// Palette
const COL = {
  concrete: 0x8a8f99,
  concreteDark: 0x5a5f6a,
  floorSlab: 0x6b7078,
  glass: 0x9fc4e8,
  glassLit: 0xffd9a0,
  lobbyFloor: 0x3a3f48,
  mallFloor: 0x4a3f52,
  resFloor: 0x5a4a42,
  officeFloor: 0x3f4a5a,
  pentFloor: 0x4a3a52,
  wall: 0x7a7f88,
  wallInner: 0x9aa0aa,
  liftShaft: 0x2a2e36,
  liftCar: 0xc8ccd4,
  liftDoor: 0x8a9098,
  stair: 0x6a6f78,
  desk: 0x8a6a4a,
  bed: 0xd8d0c8,
  bedFrame: 0x6a5a4a,
  sofa: 0x5a6a8a,
  shopA: 0xd85a5a,
  shopB: 0x5ad87a,
  shopC: 0x5a7ad8,
  escalator: 0x9a9aa8,
  taxi: 0xf0c020,
  taxiDark: 0x2a2a2a,
  person: [0xe8a0a0, 0xa0c8e8, 0xa0e8a0, 0xe8e0a0, 0xc8a0e8, 0xe8c8a0],
  skyMorning: 0x9ab8d8,
  skyNoon: 0x7aa8e0,
  skyEvening: 0xd88a5a,
  skyNight: 0x1a1e3a,
  fogMorning: 0x9ab8d8,
  fogNoon: 0x7aa8e0,
  fogEvening: 0xd88a5a,
  fogNight: 0x1a1e3a,
  street: 0x3a3a40,
  sidewalk: 0x6a6a70,
  bloomWarm: 0xffc870,
  bloomCool: 0x80b0ff,
};

// Day cycle duration (seconds)
const DAY_DURATION = 90.0;

// Lift config
const LIFT_SPEED = 2.2;         // units per second
const LIFT_STOP_TIME = 1.6;     // seconds at each floor
const LIFT_CAPACITY = 4;

// People config
const PERSON_H = 0.55;
const PERSON_W = 0.22;

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.skyMorning);
scene.fog = new THREE.Fog(COL.fogMorning, 30, 90);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
// Fixed side-on camera, slightly above street level
const CAM_TARGET = new THREE.Vector3(0, TOTAL_H * 0.48, 0);
camera.position.set(0, TOTAL_H * 0.42, 34);
camera.lookAt(CAM_TARGET);

/* ============================================================
   LIGHTS
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x3a3a40, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0d0, 1.4);
sun.position.set(-18, 30, 22);
scene.add(sun);

const ambient = new THREE.AmbientLight(0x404860, 0.5);
scene.add(ambient);

// Interior fill lights (subtle)
const interiorLight = new THREE.PointLight(0xffd9a0, 0.6, 40);
interiorLight.position.set(0, TOTAL_H * 0.5, 2);
scene.add(interiorLight);

/* ============================================================
   MATERIAL HELPERS
   ============================================================ */
const matCache = new Map();
function mat(color, opts) {
  const key = color + '|' + JSON.stringify(opts || {});
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshStandardMaterial(Object.assign({
    color: color,
    roughness: 0.85,
    metalness: 0.05,
    flatShading: false,
  }, opts || {}));
  matCache.set(key, m);
  return m;
}
function emissiveMat(color, intensity) {
  return new THREE.MeshStandardMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: intensity,
    roughness: 0.6,
    metalness: 0.0,
  });
}

function box(w, h, d, color, x, y, z, opts) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, mat(color, opts));
  m.position.set(x, y, z);
  return m;
}

/* ============================================================
   BUILDING SHELL
   ============================================================ */
const building = new THREE.Group();
scene.add(building);

// Back wall (far side, z = -BUILD_D/2)
const backWall = box(BUILD_W, TOTAL_H, 0.3, COL.wall, 0, TOTAL_H / 2, -BUILD_D / 2);
building.add(backWall);

// Side walls (thin, at x = ±BUILD_W/2)
const leftWall = box(0.3, TOTAL_H, BUILD_D, COL.wall, -BUILD_W / 2, TOTAL_H / 2, 0);
const rightWall = box(0.3, TOTAL_H, BUILD_D, COL.wall, BUILD_W / 2, TOTAL_H / 2, 0);
building.add(leftWall, rightWall);

// Floor slabs
const slabYs = [Y_LOBBY, Y_MALL, Y_RES0, Y_RES0 + FLOOR_H, Y_RES0 + 2 * FLOOR_H, Y_OFF0, Y_OFF0 + FLOOR_H, Y_OFF0 + 2 * FLOOR_H, Y_PENT, Y_ROOF];
for (const y of slabYs) {
  const slab = box(BUILD_W, 0.18, BUILD_D, COL.floorSlab, 0, y + 0.09, 0);
  building.add(slab);
}

// Roof cap
const roof = box(BUILD_W + 0.6, 0.3, BUILD_D + 0.6, COL.concreteDark, 0, Y_ROOF + 0.15, 0);
building.add(roof);

// Front facade frame (thin verticals + horizontals) — gives cutaway edge
const facadeFrame = new THREE.Group();
building.add(facadeFrame);
// Vertical mullions at front (z = BUILD_D/2)
for (let i = 0; i <= 6; i++) {
  const x = -BUILD_W / 2 + (BUILD_W / 6) * i;
  const mull = box(0.12, TOTAL_H, 0.12, COL.concreteDark, x, TOTAL_H / 2, BUILD_D / 2);
  facadeFrame.add(mull);
}
// Horizontal bands at each floor
for (const y of slabYs) {
  const band = box(BUILD_W, 0.1, 0.1, COL.concreteDark, 0, y, BUILD_D / 2);
  facadeFrame.add(band);
}

/* ============================================================
   FLOOR CONTENTS
   ============================================================ */

// --- LOBBY ---
const lobby = new THREE.Group();
building.add(lobby);
// Lobby floor
lobby.add(box(BUILD_W - 0.6, 0.05, BUILD_D - 0.6, COL.lobbyFloor, 0, Y_LOBBY + 0.2, 0));
// Reception desk
lobby.add(box(3.0, 0.9, 1.2, COL.desk, -2.0, Y_LOBBY + 0.65, 1.5));
lobby.add(box(3.2, 0.1, 1.4, COL.concreteDark, -2.0, Y_LOBBY + 1.15, 1.5));
// Revolving door (cylinder + 4 panels)
const revDoorGroup = new THREE.Group();
revDoorGroup.position.set(2.5, Y_LOBBY + 1.0, BUILD_D / 2 - 0.6);
const revCyl = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 2.0, 16, 1, true), mat(COL.glass, { transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
revDoorGroup.add(revCyl);
for (let i = 0; i < 4; i++) {
  const panel = box(0.08, 1.9, 1.8, COL.glass, 0, 0, 0, { transparent: true, opacity: 0.4 });
  panel.rotation.y = (Math.PI / 2) * i;
  panel.position.x = Math.cos((Math.PI / 2) * i) * 0.5;
  panel.position.z = Math.sin((Math.PI / 2) * i) * 0.5;
  revDoorGroup.add(panel);
}
lobby.add(revDoorGroup);
// Lobby ceiling light strip
lobby.add(box(6, 0.05, 0.3, COL.bloomWarm, 0, Y_MALL - 0.1, 0, { emissive: COL.bloomWarm, emissiveIntensity: 0.8 }));

// --- MALL FLOOR ---
const mall = new THREE.Group();
building.add(mall);
mall.add(box(BUILD_W - 0.6, 0.05, BUILD_D - 0.6, COL.mallFloor, 0, Y_MALL + 0.2, 0));
// Three shopfronts along back wall
const shopColors = [COL.shopA, COL.shopB, COL.shopC];
const shopNames = ['A', 'B', 'C'];
for (let i = 0; i < 3; i++) {
  const sx = -4.0 + i * 4.0;
  const shop = new THREE.Group();
  shop.position.set(sx, Y_MALL, -BUILD_D / 2 + 0.5);
  // Shop back
  shop.add(box(3.2, MALL_H - 0.3, 0.2, shopColors[i], 0, MALL_H / 2, 0));
  // Shop counter
  shop.add(box(2.6, 0.8, 0.6, COL.desk, 0, 0.6, 0.8));
  // Shop sign
  shop.add(box(2.8, 0.3, 0.1, shopColors[i], 0, MALL_H - 0.4, 0.1, { emissive: shopColors[i], emissiveIntensity: 0.5 }));
  mall.add(shop);
}
// Escalators (two, angled)
function makeEscalator(x, z, dir) {
  const g = new THREE.Group();
  g.position.set(x, Y_MALL, z);
  const steps = 8;
  for (let i = 0; i < steps; i++) {
    const t = i / (steps - 1);
    const step = box(0.8, 0.12, 0.5, COL.escalator, 0, t * 1.2, t * 2.0 * dir);
    g.add(step);
  }
  // Side rails
  g.add(box(0.1, 1.4, 2.2, COL.concreteDark, -0.45, 0.7, 1.0 * dir));
  g.add(box(0.1, 1.4, 2.2, COL.concreteDark, 0.45, 0.7, 1.0 * dir));
  return g;
}
mall.add(makeEscalator(-1.5, 1.0, 1));
mall.add(makeEscalator(1.5, 1.0, -1));
// Food court tables
for (let i = 0; i < 4; i++) {
  const tx = rand(-4, 4);
  const tz = rand(0.5, 3.0);
  mall.add(box(0.8, 0.05, 0.8, COL.desk, tx, Y_MALL + 0.9, tz));
  mall.add(box(0.1, 0.9, 0.1, COL.concreteDark, tx, Y_MALL + 0.45, tz));
  // Chairs
  mall.add(box(0.3, 0.4, 0.3, COL.sofa, tx - 0.6, Y_MALL + 0.4, tz));
  mall.add(box(0.3, 0.4, 0.3, COL.sofa, tx + 0.6, Y_MALL + 0.4, tz));
}

// --- RESIDENTIAL FLOORS ---
const resFloors = [];
for (let f = 0; f < RES_FLOORS; f++) {
  const y = Y_RES0 + f * FLOOR_H;
  const g = new THREE.Group();
  building.add(g);
  g.add(box(BUILD_W - 0.6, 0.05, BUILD_D - 0.6, COL.resFloor, 0, y + 0.2, 0));
  // Two condos per floor
  for (let c = 0; c < 2; c++) {
    const cx = -3.0 + c * 6.0;
    // Bed
    g.add(box(1.6, 0.4, 2.2, COL.bed, cx - 1.0, y + 0.5, -2.0));
    g.add(box(1.7, 0.15, 2.3, COL.bedFrame, cx - 1.0, y + 0.75, -2.0));
    // Pillow
    g.add(box(0.5, 0.15, 0.4, 0xffffff, cx - 1.0, y + 0.85, -2.8));
    // Sofa
    g.add(box(1.8, 0.5, 0.8, COL.sofa, cx + 1.2, y + 0.5, 1.5));
    g.add(box(1.8, 0.4, 0.2, COL.sofa, cx + 1.2, y + 0.9, 1.1));
    // Table
    g.add(box(0.8, 0.05, 0.8, COL.desk, cx + 1.2, y + 0.8, 0.0));
    g.add(box(0.08, 0.8, 0.08, COL.concreteDark, cx + 1.2, y + 0.4, 0.0));
    // Window (front)
    g.add(box(2.0, 1.4, 0.05, COL.glass, cx, y + 1.8, BUILD_D / 2 - 0.1, { transparent: true, opacity: 0.3 }));
  }
  resFloors.push(g);
}

// --- OFFICE FLOORS ---
const officeFloors = [];
for (let f = 0; f < OFFICE_FLOORS; f++) {
  const y = Y_OFF0 + f * FLOOR_H;
  const g = new THREE.Group();
  building.add(g);
  g.add(box(BUILD_W - 0.6, 0.05, BUILD_D - 0.6, COL.officeFloor, 0, y + 0.2, 0));
  // Desks in rows
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 3; c++) {
      const dx = -3.5 + c * 3.5;
      const dz = -1.5 + r * 3.0;
      g.add(box(1.4, 0.05, 0.8, COL.desk, dx, y + 0.85, dz));
      g.add(box(0.08, 0.85, 0.08, COL.concreteDark, dx - 0.6, y + 0.42, dz));
      g.add(box(0.08, 0.85, 0.08, COL.concreteDark, dx + 0.6, y + 0.42, dz));
      // Monitor
      g.add(box(0.5, 0.35, 0.05, 0x222222, dx, y + 1.1, dz - 0.2));
      g.add(box(0.5, 0.3, 0.02, COL.bloomCool, dx, y + 1.1, dz - 0.18, { emissive: COL.bloomCool, emissiveIntensity: 0.6 }));
      // Chair
      g.add(box(0.4, 0.4, 0.4, COL.sofa, dx, y + 0.4, dz + 0.7));
    }
  }
  officeFloors.push(g);
}

// --- PENTHOUSE ---
const penthouse = new THREE.Group();
building.add(penthouse);
penthouse.add(box(BUILD_W - 0.6, 0.05, BUILD_D - 0.6, COL.pentFloor, 0, Y_PENT + 0.2, 0));
// Large bed
penthouse.add(box(2.2, 0.4, 2.6, COL.bed, -2.0, Y_PENT + 0.5, -2.0));
penthouse.add(box(2.3, 0.15, 2.7, COL.bedFrame, -2.0, Y_PENT + 0.75, -2.0));
// Sofa
penthouse.add(box(2.4, 0.5, 0.9, COL.sofa, 2.0, Y_PENT + 0.5, 1.5));
// Coffee table
penthouse.add(box(1.2, 0.05, 0.8, COL.desk, 2.0, Y_PENT + 0.8, 0.0));
// Plant
penthouse.add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 0.4, 8), mat(0x5a4a3a)));
penthouse.children[penthouse.children.length - 1].position.set(4.5, Y_PENT + 0.4, 2.5);
penthouse.add(new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6), mat(0x3a7a3a)));
penthouse.children[penthouse.children.length - 1].position.set(4.5, Y_PENT + 0.9, 2.5);
// Big window
penthouse.add(box(4.0, 2.0, 0.05, COL.glass, 0, Y_PENT + 1.8, BUILD_D / 2 - 0.1, { transparent: true, opacity: 0.3 }));

/* ============================================================
   LIFT SHAFTS & CARS
   ============================================================ */
const liftShafts = [];
const liftCars = [];
const liftState = [];

for (let s = 0; s < 2; s++) {
  const sx = LIFT_X[s];
  // Shaft walls
  const shaftGroup = new THREE.Group();
  building.add(shaftGroup);
  shaftGroup.add(box(LIFT_W + 0.2, TOTAL_H, 0.1, COL.liftShaft, sx, TOTAL_H / 2, -BUILD_D / 2 + 1.0));
  shaftGroup.add(box(0.1, TOTAL_H, LIFT_W + 0.2, COL.liftShaft, sx - LIFT_W / 2 - 0.1, TOTAL_H / 2, -BUILD_D / 2 + 1.0 + LIFT_W / 2));
  shaftGroup.add(box(0.1, TOTAL_H, LIFT_W + 0.2, COL.liftShaft, sx + LIFT_W / 2 + 0.1, TOTAL_H / 2, -BUILD_D / 2 + 1.0 + LIFT_W / 2));
  liftShafts.push(shaftGroup);

  // Lift car
  const car = new THREE.Group();
  car.add(box(LIFT_W - 0.1, 2.2, LIFT_W - 0.1, COL.liftCar, 0, 1.1, 0));
  // Doors (front)
  car.add(box(LIFT_W - 0.2, 2.0, 0.05, COL.liftDoor, 0, 1.0, LIFT_W / 2 - 0.05));
  // Interior light
  car.add(box(LIFT_W - 0.3, 0.05, LIFT_W - 0.3, COL.bloomWarm, 0, 2.15, 0, { emissive: COL.bloomWarm, emissiveIntensity: 0.7 }));
  car.position.set(sx, Y_LOBBY, -BUILD_D / 2 + 1.0 + LIFT_W / 2);
  building.add(car);
  liftCars.push(car);

  // State
  liftState.push({
    y: Y_LOBBY,
    targetY: Y_LOBBY,
    state: 'idle', // idle, moving, stopping
    stopTimer: 0,
    direction: 1,
    riders: [],
    nextFloor: 0,
  });
}

// Floor stop positions for lifts
const floorStops = [Y_LOBBY, Y_MALL, Y_RES0, Y_RES0 + FLOOR_H, Y_RES0 + 2 * FLOOR_H, Y_OFF0, Y_OFF0 + FLOOR_H, Y_OFF0 + 2 * FLOOR_H, Y_PENT];

/* ============================================================
   STAIRWELL
   ============================================================ */
const stairGroup = new THREE.Group();
building.add(stairGroup);
// Stairwell walls
stairGroup.add(box(0.1, TOTAL_H, STAIR_W, COL.stair, STAIR_X - STAIR_W / 2, TOTAL_H / 2, -BUILD_D / 2 + 1.0 + STAIR_W / 2));
stairGroup.add(box(0.1, TOTAL_H, STAIR_W, COL.stair, STAIR_X + STAIR_W / 2, TOTAL_H / 2, -BUILD_D / 2 + 1.0 + STAIR_W / 2));
// Stair steps (zigzag)
const numStairFlights = Math.floor(TOTAL_H / FLOOR_H);
for (let f = 0; f < numStairFlights; f++) {
  const baseY = f * FLOOR_H;
  const stepsPerFlight = 6;
  for (let i = 0; i < stepsPerFlight; i++) {
    const t = i / stepsPerFlight;
    const stepY = baseY + t * FLOOR_H;
    const stepZ = -BUILD_D / 2 + 1.0 + STAIR_W / 2 + (i % 2 === 0 ? 0.3 : -0.3);
    stairGroup.add(box(STAIR_W - 0.2, 0.12, 0.4, COL.stair, STAIR_X, stepY + 0.06, stepZ));
  }
}

/* ============================================================
   PEOPLE (agents)
   ============================================================ */
const people = [];
const PEOPLE_COUNT = 28;

function makePerson(color) {
  const g = new THREE.Group();
  // Body
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, PERSON_H * 0.6, 6), mat(color));
  body.position.y = PERSON_H * 0.3;
  g.add(body);
  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 5), mat(0xe8c8a8));
  head.position.y = PERSON_H * 0.75;
  g.add(head);
  return g;
}

// People categories: street walkers, lift riders, floor wanderers
for (let i = 0; i < PEOPLE_COUNT; i++) {
  const color = pick(COL.person);
  const mesh = makePerson(color);
  scene.add(mesh);
  const type = i < 8 ? 'street' : (i < 18 ? 'lift' : 'floor');
  people.push({
    mesh: mesh,
    type: type,
    color: color,
    // street
    streetX: rand(-20, 20),
    streetDir: rng() > 0.5 ? 1 : -1,
    streetSpeed: rand(0.8, 1.6),
    // lift
    liftIndex: randInt(0, 1),
    liftState: 'waiting', // waiting, riding, exiting
    liftFloor: randInt(0, floorStops.length - 1),
    liftWaitTimer: rand(0, 3),
    // floor wander
    floorY: floorStops[randInt(0, floorStops.length - 1)],
    floorX: rand(-5, 5),
    floorDir: rng() > 0.5 ? 1 : -1,
    floorSpeed: rand(0.3, 0.8),
    floorZ: rand(-2, 2),
  });
}

/* ============================================================
   TAXIS
   ============================================================ */
const taxis = [];
const TAXI_COUNT = 5;
for (let i = 0; i < TAXI_COUNT; i++) {
  const g = new THREE.Group();
  // Body
  g.add(box(1.8, 0.5, 0.9, COL.taxi, 0, 0.35, 0));
  // Cabin
  g.add(box(1.0, 0.4, 0.8, COL.taxi, -0.1, 0.75, 0));
  // Windows
  g.add(box(0.9, 0.3, 0.05, COL.glass, -0.1, 0.75, 0.42, { transparent: true, opacity: 0.4 }));
  // Wheels
  const wheelGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 8);
  const wheelMat = mat(COL.taxiDark);
  for (const wx of [-0.6, 0.6]) {
    for (const wz of [-0.4, 0.4]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.x = Math.PI / 2;
      w.position.set(wx, 0.15, wz);
      g.add(w);
    }
  }
  // Roof light
  g.add(box(0.3, 0.1, 0.2, COL.bloomWarm, -0.1, 0.98, 0, { emissive: COL.bloomWarm, emissiveIntensity: 0.8 }));
  g.position.set(rand(-20, 20), STREET_Y, BUILD_D / 2 + 2.5);
  scene.add(g);
  taxis.push({
    mesh: g,
    x: g.position.x,
    dir: rng() > 0.5 ? 1 : -1,
    speed: rand(2.0, 4.0),
  });
}

/* ============================================================
   STREET & SIDEWALK
   ============================================================ */
const street = box(60, 0.1, 6, COL.street, 0, STREET_Y - 0.05, BUILD_D / 2 + 3.0);
scene.add(street);
const sidewalk = box(60, 0.15, 2.0, COL.sidewalk, 0, STREET_Y + 0.05, BUILD_D / 2 + 0.8);
scene.add(sidewalk);
// Street lamps
for (let i = -2; i <= 2; i++) {
  const lampX = i * 8;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 3.5, 6), mat(COL.concreteDark));
  pole.position.set(lampX, STREET_Y + 1.75, BUILD_D / 2 + 1.8);
  scene.add(pole);
  const lampHead = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 5), emissiveMat(COL.bloomWarm, 1.0));
  lampHead.position.set(lampX, STREET_Y + 3.5, BUILD_D / 2 + 1.8);
  scene.add(lampHead);
}

/* ============================================================
   BLOOM SPRITES (additive translucent planes)
   ============================================================ */
const bloomSprites = [];
function makeBloomSprite(color, size, x, y, z, intensity) {
  const geo = new THREE.PlaneGeometry(size, size);
  const m = new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: intensity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const sprite = new THREE.Mesh(geo, m);
  sprite.position.set(x, y, z);
  scene.add(sprite);
  bloomSprites.push({ mesh: sprite, baseOpacity: intensity, phase: rand(0, Math.PI * 2) });
  return sprite;
}

// Window bloom sprites on front facade
const windowBloomPositions = [];
for (let f = 0; f < slabYs.length - 1; f++) {
  const y = slabYs[f] + FLOOR_H * 0.5;
  for (let c = 0; c < 5; c++) {
    const x = -BUILD_W / 2 + 1.4 + c * 2.8;
    windowBloomPositions.push({ x: x, y: y, z: BUILD_D / 2 + 0.1 });
  }
}
const windowBlooms = [];
for (const p of windowBloomPositions) {
  const s = makeBloomSprite(COL.bloomWarm, 1.2, p.x, p.y, p.z, 0.0);
  windowBlooms.push(s);
}

// Street lamp blooms
const lampBlooms = [];
for (let i = -2; i <= 2; i++) {
  const lampX = i * 8;
  const s = makeBloomSprite(COL.bloomWarm, 2.0, lampX, STREET_Y + 3.5, BUILD_D / 2 + 1.8, 0.0);
  lampBlooms.push(s);
}

// Lift interior blooms
const liftBlooms = [];
for (let s = 0; s < 2; s++) {
  const b = makeBloomSprite(COL.bloomWarm, 1.0, LIFT_X[s], Y_LOBBY + 1.0, -BUILD_D / 2 + 1.0 + LIFT_W / 2, 0.3);
  liftBlooms.push(b);
}

/* ============================================================
   HUD
   ============================================================ */
const hudEl = document.getElementById('hud');
let hudClock = 0;
let hudResidents = 0;
let hudLifts = 0;
let hudTaxis = 0;

function updateHUD(dayT) {
  const hours = (dayT * 24) % 24;
  const hh = Math.floor(hours);
  const mm = Math.floor((hours - hh) * 60);
  const timeStr = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  hudEl.innerHTML =
    '<span class="k">CLOCK</span> <span class="v">' + timeStr + '</span><br>' +
    '<span class="k">RESIDENTS</span> <span class="v">' + hudResidents + '</span><br>' +
    '<span class="k">LIFTS</span> <span class="v">' + hudLifts + '</span><br>' +
    '<span class="k">TAXIS</span> <span class="v">' + hudTaxis + '</span>';
}

/* ============================================================
   DAY/NIGHT CYCLE
   ============================================================ */
let dayT = 0.25; // start at morning

function lerpColor(a, b, t) {
  const ca = new THREE.Color(a);
  const cb = new THREE.Color(b);
  return ca.lerp(cb, t);
}

function updateDayNight(dt) {
  dayT = (dayT + dt / DAY_DURATION) % 1.0;
  // 0 = midnight, 0.25 = morning, 0.5 = noon, 0.75 = evening
  let skyColor, fogColor, sunIntensity, hemiIntensity, ambientIntensity;
  if (dayT < 0.25) {
    // night -> morning
    const t = dayT / 0.25;
    skyColor = lerpColor(COL.skyNight, COL.skyMorning, t);
    fogColor = lerpColor(COL.fogNight, COL.fogMorning, t);
    sunIntensity = 0.1 + t * 1.0;
    hemiIntensity = 0.2 + t * 0.6;
    ambientIntensity = 0.2 + t * 0.3;
  } else if (dayT < 0.5) {
    // morning -> noon
    const t = (dayT - 0.25) / 0.25;
    skyColor = lerpColor(COL.skyMorning, COL.skyNoon, t);
    fogColor = lerpColor(COL.fogMorning, COL.fogNoon, t);
    sunIntensity = 1.1 + t * 0.3;
    hemiIntensity = 0.8 + t * 0.1;
    ambientIntensity = 0.5 + t * 0.1;
  } else if (dayT < 0.75) {
    // noon -> evening
    const t = (dayT - 0.5) / 0.25;
    skyColor = lerpColor(COL.skyNoon, COL.skyEvening, t);
    fogColor = lerpColor(COL.fogNoon, COL.fogEvening, t);
    sunIntensity = 1.4 - t * 0.6;
    hemiIntensity = 0.9 - t * 0.3;
    ambientIntensity = 0.6 - t * 0.2;
  } else {
    // evening -> night
    const t = (dayT - 0.75) / 0.25;
    skyColor = lerpColor(COL.skyEvening, COL.skyNight, t);
    fogColor = lerpColor(COL.fogEvening, COL.fogNight, t);
    sunIntensity = 0.8 - t * 0.7;
    hemiIntensity = 0.6 - t * 0.4;
    ambientIntensity = 0.4 - t * 0.2;
  }

  scene.background.copy(skyColor);
  scene.fog.color.copy(fogColor);
  sun.intensity = Math.max(0.05, sunIntensity);
  hemi.intensity = Math.max(0.1, hemiIntensity);
  ambient.intensity = Math.max(0.1, ambientIntensity);

  // Sun position arc
  const sunAngle = dayT * Math.PI * 2 - Math.PI / 2;
  sun.position.set(Math.cos(sunAngle) * 30, Math.sin(sunAngle) * 30 + 10, 22);

  // Window lights: on at night, off during day
  const nightFactor = (dayT > 0.72 || dayT < 0.22) ? 1.0 : 0.0;
  const duskFactor = (dayT > 0.65 && dayT <= 0.72) ? (dayT - 0.65) / 0.07 : 0.0;
  const dawnFactor = (dayT >= 0.22 && dayT < 0.3) ? 1.0 - (dayT - 0.22) / 0.08 : 0.0;
  const litFactor = Math.max(nightFactor, duskFactor, dawnFactor);

  for (let i = 0; i < windowBlooms.length; i++) {
    const b = windowBlooms[i];
    const flicker = 0.85 + 0.15 * Math.sin(performance.now() * 0.001 + i * 1.7);
    b.material.opacity = litFactor * 0.35 * flicker;
  }
  for (const b of lampBlooms) {
    b.material.opacity = litFactor * 0.5;
  }
  for (const b of liftBlooms) {
    b.material.opacity = 0.2 + litFactor * 0.3;
  }

  // Interior light
  interiorLight.intensity = 0.3 + litFactor * 0.8;
}

/* ============================================================
   LIFT LOGIC
   ============================================================ */
function updateLifts(dt) {
  let activeLifts = 0;
  for (let s = 0; s < 2; s++) {
    const st = liftState[s];
    const car = liftCars[s];

    if (st.state === 'idle') {
      // Pick next floor
      st.nextFloor = randInt(0, floorStops.length - 1);
      st.targetY = floorStops[st.nextFloor];
      st.state = 'moving';
      st.direction = st.targetY > st.y ? 1 : -1;
    } else if (st.state === 'moving') {
      const dy = st.targetY - st.y;
      const step = LIFT_SPEED * dt;
      if (Math.abs(dy) <= step) {
        st.y = st.targetY;
        st.state = 'stopping';
        st.stopTimer = LIFT_STOP_TIME;
      } else {
        st.y += Math.sign(dy) * step;
      }
      activeLifts++;
    } else if (st.state === 'stopping') {
      st.stopTimer -= dt;
      if (st.stopTimer <= 0) {
        st.state = 'idle';
      }
      activeLifts++;
    }

    car.position.y = st.y;
    // Update lift bloom position
    liftBlooms[s].mesh.position.y = st.y + 1.0;
  }
  hudLifts = activeLifts;
}

/* ============================================================
   PEOPLE LOGIC
   ============================================================ */
function updatePeople(dt) {
  let residents = 0;
  for (const p of people) {
    if (p.type === 'street') {
      p.streetX += p.streetDir * p.streetSpeed * dt;
      if (p.streetX > 20) { p.streetX = -20; p.streetDir = 1; }
      if (p.streetX < -20) { p.streetX = 20; p.streetDir = -1; }
      p.mesh.position.set(p.streetX, STREET_Y + 0.15, BUILD_D / 2 + 1.2);
      p.mesh.rotation.y = p.streetDir > 0 ? Math.PI / 2 : -Math.PI / 2;
      residents++;
    } else if (p.type === 'lift') {
      // Simple lift riding simulation
      const st = liftState[p.liftIndex];
      const car = liftCars[p.liftIndex];
      if (p.liftState === 'waiting') {
        p.liftWaitTimer -= dt;
        if (p.liftWaitTimer <= 0 && st.state === 'stopping') {
          // Board if car is at this floor
          const carFloorY = st.y;
          const targetFloorY = floorStops[p.liftFloor];
          if (Math.abs(carFloorY - targetFloorY) < 0.5) {
            p.liftState = 'riding';
            p.mesh.visible = true;
          }
        }
        // Waiting person stands near lift
        p.mesh.position.set(LIFT_X[p.liftIndex] + 0.8, floorStops[p.liftFloor] + 0.15, -BUILD_D / 2 + 2.5);
        p.mesh.visible = true;
      } else if (p.liftState === 'riding') {
        // Ride with car
        p.mesh.position.set(LIFT_X[p.liftIndex], st.y + 0.15, -BUILD_D / 2 + 1.0 + LIFT_W / 2);
        p.mesh.visible = true;
        // Exit when car stops
        if (st.state === 'stopping' && st.stopTimer < LIFT_STOP_TIME * 0.5) {
          p.liftState = 'exiting';
          p.liftFloor = randInt(0, floorStops.length - 1);
          p.liftWaitTimer = rand(1, 4);
        }
      } else if (p.liftState === 'exiting') {
        // Walk away from lift
        p.mesh.position.set(LIFT_X[p.liftIndex] + 1.5, floorStops[p.liftFloor] + 0.15, -BUILD_D / 2 + 2.5);
        p.mesh.visible = true;
        p.liftState = 'waiting';
        p.liftWaitTimer = rand(2, 6);
      }
      residents++;
    } else if (p.type === 'floor') {
      p.floorX += p.floorDir * p.floorSpeed * dt;
      if (p.floorX > 5) { p.floorX = 5; p.floorDir = -1; }
      if (p.floorX < -5) { p.floorX = -5; p.floorDir = 1; }
      p.mesh.position.set(p.floorX, p.floorY + 0.15, p.floorZ);
      p.mesh.rotation.y = p.floorDir > 0 ? Math.PI / 2 : -Math.PI / 2;
      residents++;
    }
  }
  hudResidents = residents;
}

/* ============================================================
   TAXI LOGIC
   ============================================================ */
function updateTaxis(dt) {
  let active = 0;
  for (const t of taxis) {
    t.x += t.dir * t.speed * dt;
    if (t.x > 25) { t.x = -25; t.dir = 1; }
    if (t.x < -25) { t.x = 25; t.dir = -1; }
    t.mesh.position.x = t.x;
    t.mesh.rotation.y = t.dir > 0 ? 0 : Math.PI;
    active++;
  }
  hudTaxis = active;
}

/* ============================================================
   REVOLVING DOOR ANIMATION
   ============================================================ */
function updateRevolvingDoor(dt) {
  revDoorGroup.rotation.y += dt * 0.8;
}

/* ============================================================
   BLOOM SPRITE ANIMATION
   ============================================================ */
function updateBloomSprites(dt) {
  const t = performance.now() * 0.001;
  for (const b of bloomSprites) {
    const pulse = 0.9 + 0.1 * Math.sin(t * 2 + b.phase);
    b.mesh.material.opacity = b.baseOpacity * pulse;
  }
}

/* ============================================================
   RESIZE
   ============================================================ */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  let dt = clock.getDelta();
  if (dt > 1 / 30) dt = 1 / 30;

  updateDayNight(dt);
  updateLifts(dt);
  updatePeople(dt);
  updateTaxis(dt);
  updateRevolvingDoor(dt);
  updateBloomSprites(dt);
  updateHUD(dayT);

  renderer.render(scene, camera);
}

animate();
</script>
