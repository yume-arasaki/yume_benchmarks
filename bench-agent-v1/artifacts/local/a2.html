<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLANNER</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2b3440;
    --ink:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --crit:#f0883e;
    --ok:#3fb950; --bad:#f85149; --grid:#232b35;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  #app{display:flex;flex-direction:column;min-height:100vh}
  header{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 16px;background:linear-gradient(180deg,#1b2230,#141a22);
    border-bottom:1px solid var(--line);
  }
  header .title{font-weight:700;letter-spacing:.08em;color:var(--accent)}
  header .badge{
    padding:2px 8px;border:1px solid var(--line);border-radius:999px;
    background:var(--panel2);color:var(--dim);font-size:11px;letter-spacing:.05em;
  }
  header .badge b{color:var(--ink)}
  header .st-ok{color:var(--ok)}
  header .st-bad{color:var(--bad)}
  header .spacer{flex:1}
  header .rec{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);
    animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.4fr);
    gap:14px;padding:14px;align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    overflow:hidden;display:flex;flex-direction:column}
  .card h2{margin:0;padding:9px 12px;font-size:11px;letter-spacing:.12em;
    color:var(--dim);background:var(--panel2);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px}
  .card h2 .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .workers{display:flex;gap:4px}
  .workers button{
    background:var(--panel);border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:2px 9px;cursor:pointer;font:inherit;font-size:11px}
  .workers button.on{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}
  table{width:100%;border-collapse:collapse}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;
    vertical-align:middle;white-space:nowrap}
  th{font-size:10px;letter-spacing:.1em;color:var(--dim);font-weight:600;
    background:var(--panel2);position:sticky;top:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.crit td{background:rgba(240,136,62,.10)}
  tr.crit td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
  .tid{color:var(--accent);font-weight:700}
  tr.crit .tid{color:var(--crit)}
  .dur{width:52px;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:5px;padding:2px 5px;font:inherit;font-size:12px;
    text-align:right}
  .dur:focus{outline:1px solid var(--accent)}
  .deps{color:var(--dim);font-size:11px}
  .deps .d{display:inline-block;padding:0 4px;margin:0 2px 2px 0;
    border:1px solid var(--line);border-radius:4px;background:var(--panel2)}
  .deps .d.crit{color:var(--crit);border-color:var(--crit)}
  .deps .d .x{cursor:pointer;color:var(--bad);margin-left:3px}
  .adddep{display:flex;gap:4px;margin-top:3px}
  .adddep select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:4px;font:inherit;font-size:11px;padding:1px 3px}
  .adddep button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    border-radius:4px;font:inherit;font-size:11px;padding:1px 6px;cursor:pointer}
  .adddep button:hover{color:var(--ink);border-color:var(--accent)}
  .err{padding:10px 12px;color:var(--bad);background:rgba(248,81,73,.08);
    border-top:1px solid var(--bad);font-size:12px}
  .gantt{position:relative;padding:10px 12px 14px}
  .gantt svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:14px;padding:0 12px 10px;font-size:11px;color:var(--dim)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;
    margin-right:5px;vertical-align:middle}
  .meta{padding:8px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;
    display:flex;gap:16px;flex-wrap:wrap}
  .meta b{color:var(--ink)}
  .meta .critv{color:var(--crit)}
  footer{padding:8px 16px;color:var(--dim);font-size:11px;border-top:1px solid var(--line);
    display:flex;gap:16px;flex-wrap:wrap}
  footer .f{color:var(--bad)}
  footer .p{color:var(--ok)}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">PLANNER</span>
    <span class="badge" id="hdrTasks">14 TASKS</span>
    <span class="badge" id="hdrMakespan">MAKESPAN 8d</span>
    <span class="badge" id="hdrSelftest">SELFTEST 0/0</span>
    <span class="spacer"></span>
    <span class="rec"><span class="dot"></span>REC</span>
  </header>

  <main>
    <section class="card">
      <h2>TASKS
        <span class="right">
          <span style="font-size:10px;color:var(--dim)">WORKERS</span>
          <span class="workers" id="workers">
            <button data-w="1">1</button>
            <button data-w="2">2</button>
            <button data-w="3">3</button>
          </span>
        </span>
      </h2>
      <div id="tableWrap"></div>
      <div id="errWrap"></div>
    </section>

    <section class="card">
      <h2>GANTT</h2>
      <div class="gantt" id="ganttWrap"></div>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>task</span>
        <span><i style="background:var(--crit)"></i>critical path</span>
        <span><i style="background:var(--grid)"></i>idle</span>
      </div>
      <div class="meta" id="meta"></div>
    </section>
  </main>

  <footer id="footer"></footer>
</div>

<script>
"use strict";

/* ============================================================
   CONSTANTS & TABLES (declared at top)
   ============================================================ */
const SEED = 1337;

const DEFAULT_TASKS = [
  { id: "A", dur: 2, deps: [] },
  { id: "B", dur: 3, deps: ["A"] },
  { id: "C", dur: 4, deps: ["A"] },
  { id: "D", dur: 1, deps: ["B", "C"] },
  { id: "E", dur: 2, deps: ["D"] },
  { id: "F", dur: 3, deps: ["D"] },
  { id: "G", dur: 1, deps: ["E"] },
  { id: "H", dur: 2, deps: ["F"] },
  { id: "I", dur: 2, deps: ["G", "H"] },
  { id: "J", dur: 1, deps: ["I"] },
  { id: "K", dur: 2, deps: ["J"] },
  { id: "L", dur: 1, deps: ["K"] },
  { id: "M", dur: 2, deps: ["L"] },
  { id: "N", dur: 1, deps: ["M"] }
];

const DEFAULT_WORKERS = 2;

const COLORS = {
  accent: "#58a6ff",
  crit: "#f0883e",
  grid: "#232b35",
  line: "#2b3440",
  dim: "#8b949e",
  ink: "#e6edf3",
  panel2: "#1c232c"
};

const GANTT = {
  rowH: 22,
  padTop: 8,
  padLeft: 34,
  padRight: 12,
  padBottom: 22,
  barH: 14
};

/* ============================================================
   SEEDED PRNG (deterministic; no Math.random anywhere)
   ============================================================ */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(SEED);

/* ============================================================
   PURE SCHEDULER (no DOM access)
   ============================================================ */
function schedule(tasks, workers) {
  // Validate input shape
  if (!Array.isArray(tasks)) return { ok: false, error: "tasks must be an array" };
  if (typeof workers !== "number" || !isFinite(workers) || workers < 1) {
    return { ok: false, error: "workers must be a positive number" };
  }
  workers = Math.floor(workers);

  const byId = Object.create(null);
  for (let i = 0; i < tasks.length; i++) {
    const t = tasks[i];
    if (!t || typeof t.id !== "string") return { ok: false, error: "task missing id" };
    if (byId[t.id]) return { ok: false, error: "duplicate task id: " + t.id };
    if (typeof t.dur !== "number" || !isFinite(t.dur) || t.dur < 0) {
      return { ok: false, error: "invalid duration for " + t.id };
    }
    byId[t.id] = { id: t.id, dur: t.dur, deps: Array.isArray(t.deps) ? t.deps.slice() : [] };
  }

  // Missing dependency check
  for (const id in byId) {
    const t = byId[id];
    for (const d of t.deps) {
      if (!byId[d]) return { ok: false, error: "missing dependency " + d + " for " + id };
    }
  }

  // Cycle detection via Kahn's algorithm
  const indeg = Object.create(null);
  const adj = Object.create(null);
  for (const id in byId) { indeg[id] = 0; adj[id] = []; }
  for (const id in byId) {
    for (const d of byId[id].deps) {
      adj[d].push(id);
      indeg[id]++;
    }
  }
  const queue = [];
  for (const id in indeg) if (indeg[id] === 0) queue.push(id);
  let seen = 0;
  const order = [];
  while (queue.length) {
    const id = queue.shift();
    order.push(id);
    seen++;
    for (const n of adj[id]) {
      indeg[n]--;
      if (indeg[n] === 0) queue.push(n);
    }
  }
  if (seen !== Object.keys(byId).length) {
    return { ok: false, error: "dependency cycle detected" };
  }

  // Resource-constrained earliest start/finish.
  // Process in topological order; a task starts at max(dep finishes) but
  // must also wait for a worker slot. We simulate time with an event list.
  const start = Object.create(null);
  const finish = Object.create(null);
  const remaining = Object.create(null);
  for (const id in byId) remaining[id] = byId[id].deps.length;

  const ready = []; // ids whose deps are all finished but not yet started
  const running = []; // {id, finishTime}
  let now = 0;
  let done = 0;
  const total = Object.keys(byId).length;

  // Seed ready set
  for (const id in byId) if (remaining[id] === 0) ready.push(id);

  // Sort ready deterministically by id for stability
  const sortIds = (arr) => arr.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));

  while (done < total) {
    // Start as many ready tasks as workers allow
    sortIds(ready);
    while (ready.length > 0 && running.length < workers) {
      const id = ready.shift();
      start[id] = now;
      finish[id] = now + byId[id].dur;
      running.push({ id: id, finishTime: finish[id] });
    }

    if (running.length === 0) {
      // Should not happen in a valid DAG, but guard anyway
      if (ready.length === 0) break;
      continue;
    }

    // Advance to next finish time
    let nextTime = Infinity;
    for (const r of running) if (r.finishTime < nextTime) nextTime = r.finishTime;
    now = nextTime;

    // Retire finished tasks
    const stillRunning = [];
    for (const r of running) {
      if (r.finishTime <= now) {
        done++;
        for (const n of adj[r.id]) {
          remaining[n]--;
          if (remaining[n] === 0) ready.push(n);
        }
      } else {
        stillRunning.push(r);
      }
    }
    running.length = 0;
    for (const r of stillRunning) running.push(r);
  }

  let makespan = 0;
  for (const id in finish) if (finish[id] > makespan) makespan = finish[id];

  // Critical path: chain of zero-slack tasks determining makespan.
  // Compute latest finish (LF) via reverse topological order.
  const lf = Object.create(null);
  const succ = adj;
  for (let i = order.length - 1; i >= 0; i--) {
    const id = order[i];
    if (succ[id].length === 0) {
      lf[id] = makespan;
    } else {
      let m = Infinity;
      for (const s of succ[id]) if (lf[s] < m) m = lf[s];
      lf[id] = m;
    }
  }
  // Slack = LF - EF. Zero-slack tasks form the critical set.
  const slack = Object.create(null);
  for (const id in byId) slack[id] = lf[id] - finish[id];

  // Build an ordered critical chain: start from a zero-slack task with no
  // zero-slack predecessor, follow zero-slack successors.
  const critSet = Object.create(null);
  for (const id in byId) if (Math.abs(slack[id]) < 1e-9) critSet[id] = true;

  // Find a start: zero-slack task whose deps are not all zero-slack (or none)
  let chainStart = null;
  for (const id of order) {
    if (!critSet[id]) continue;
    let hasCritPred = false;
    for (const d of byId[id].deps) if (critSet[d]) hasCritPred = true;
    if (!hasCritPred) { chainStart = id; break; }
  }
  const critical = [];
  if (chainStart) {
    let cur = chainStart;
    const guard = new Set();
    while (cur && !guard.has(cur)) {
      guard.add(cur);
      critical.push(cur);
      let next = null;
      for (const s of succ[cur]) {
        if (critSet[s]) { next = s; break; }
      }
      cur = next;
    }
  }

  return {
    ok: true,
    makespan: makespan,
    start: start,
    finish: finish,
    critical: critical
  };
}

/* ============================================================
   PUBLIC API (headless, no DOM)
   ============================================================ */
window.API = {
  schedule: function (tasks, workers) {
    return schedule(tasks, workers);
  }
};

/* ============================================================
   SELF-TEST
   ============================================================ */
window.__selftest = function () {
  const failures = [];
  let passed = 0;
  let total = 0;

  function check(name, cond, detail) {
    total++;
    if (cond) passed++;
    else failures.push(name + (detail ? " :: " + detail : ""));
  }

  // Test 1: A(2)->B(3), A->C(4), B,C->D(1) makespan 7, critical A,C,D
  {
    const tasks = [
      { id: "A", dur: 2, deps: [] },
      { id: "B", dur: 3, deps: ["A"] },
      { id: "C", dur: 4, deps: ["A"] },
      { id: "D", dur: 1, deps: ["B", "C"] }
    ];
    const r = window.API.schedule(tasks, 2);
    check("t1 ok", r.ok === true, JSON.stringify(r));
    check("t1 makespan 7", r.ok && r.makespan === 7, r.ok ? String(r.makespan) : "");
    const critStr = r.ok ? r.critical.join(",") : "";
    check("t1 critical A,C,D", critStr === "A,C,D", critStr);
  }

  // Test 2: every task starts at or after all deps finish
  {
    const tasks = [
      { id: "A", dur: 2, deps: [] },
      { id: "B", dur: 3, deps: ["A"] },
      { id: "C", dur: 4, deps: ["A"] },
      { id: "D", dur: 1, deps: ["B", "C"] },
      { id: "E", dur: 2, deps: ["D"] }
    ];
    const r = window.API.schedule(tasks, 2);
    let ok = r.ok;
    if (ok) {
      for (const t of tasks) {
        for (const d of t.deps) {
          if (r.start[t.id] < r.finish[d]) { ok = false; break; }
        }
      }
    }
    check("t2 deps respected", ok);
  }

  // Test 3: no more than workers tasks overlap
  {
    const tasks = [
      { id: "A", dur: 3, deps: [] },
      { id: "B", dur: 3, deps: [] },
      { id: "C", dur: 3, deps: [] },
      { id: "D", dur: 2, deps: [] },
      { id: "E", dur: 2, deps: [] }
    ];
    const r = window.API.schedule(tasks, 2);
    let ok = r.ok;
    if (ok) {
      // sample at integer times
      const maxT = r.makespan;
      for (let t = 0; t <= maxT; t++) {
        let count = 0;
        for (const task of tasks) {
          if (r.start[task.id] <= t && t < r.finish[task.id]) count++;
        }
        if (count > 2) { ok = false; break; }
      }
    }
    check("t3 workers<=2 overlap", ok);
  }

  // Test 4: workers 1 -> no two tasks overlap
  {
    const tasks = [
      { id: "A", dur: 2, deps: [] },
      { id: "B", dur: 3, deps: ["A"] },
      { id: "C", dur: 4, deps: ["A"] },
      { id: "D", dur: 1, deps: ["B", "C"] }
    ];
    const r = window.API.schedule(tasks, 1);
    let ok = r.ok;
    if (ok) {
      const intervals = tasks.map(t => [r.start[t.id], r.finish[t.id]]);
      intervals.sort((a, b) => a[0] - b[0]);
      for (let i = 1; i < intervals.length; i++) {
        if (intervals[i][0] < intervals[i - 1][1]) { ok = false; break; }
      }
    }
    check("t4 workers=1 no overlap", ok);
  }

  // Test 5: workers 3 -> makespan equals dependency critical path
  {
    const tasks = [
      { id: "A", dur: 2, deps: [] },
      { id: "B", dur: 3, deps: ["A"] },
      { id: "C", dur: 4, deps: ["A"] },
      { id: "D", dur: 1, deps: ["B", "C"] }
    ];
    const r = window.API.schedule(tasks, 3);
    // dependency critical path length = A(2)+C(4)+D(1) = 7
    check("t5 workers=3 makespan=7", r.ok && r.makespan === 7, r.ok ? String(r.makespan) : "");
  }

  // Test 6: cycle returns ok:false
  {
    const tasks = [
      { id: "A", dur: 1, deps: ["B"] },
      { id: "B", dur: 1, deps: ["A"] }
    ];
    const r = window.API.schedule(tasks, 2);
    check("t6 cycle ok:false", r.ok === false && typeof r.error === "string");
  }

  // Test 7: missing dependency returns ok:false
  {
    const tasks = [{ id: "A", dur: 1, deps: ["Z"] }];
    const r = window.API.schedule(tasks, 2);
    check("t7 missing dep ok:false", r.ok === false && typeof r.error === "string");
  }

  // Test 8: single task
  {
    const r = window.API.schedule([{ id: "A", dur: 5, deps: [] }], 1);
    check("t8 single task", r.ok && r.makespan === 5 && r.critical.join(",") === "A");
  }

  // Test 9: empty tasks
  {
    const r = window.API.schedule([], 2);
    check("t9 empty", r.ok && r.makespan === 0);
  }

  // Test 10: deterministic repeat
  {
    const tasks = [
      { id: "A", dur: 2, deps: [] },
      { id: "B", dur: 3, deps: ["A"] },
      { id: "C", dur: 4, deps: ["A"] },
      { id: "D", dur: 1, deps: ["B", "C"] }
    ];
    const r1 = window.API.schedule(tasks, 2);
    const r2 = window.API.schedule(tasks, 2);
    check("t10 deterministic", JSON.stringify(r1) === JSON.stringify(r2));
  }

  return { passed: passed, total: total, failures: failures };
};

/* ============================================================
   APP STATE
   ============================================================ */
const state = {
  tasks: DEFAULT_TASKS.map(t => ({ id: t.id, dur: t.dur, deps: t.deps.slice() })),
  workers: DEFAULT_WORKERS,
  result: null,
  selftest: null
};

/* ============================================================
   DOM HELPERS
   ============================================================ */
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
  }
  if (children) {
    for (const c of children) {
      if (typeof c === "string") node.appendChild(document.createTextNode(c));
      else if (c) node.appendChild(c);
    }
  }
  return node;
}

/* ============================================================
   RECOMPUTE
   ============================================================ */
function recompute() {
  state.result = window.API.schedule(state.tasks, state.workers);
  render();
}

/* ============================================================
   RENDER: HEADER
   ============================================================ */
function renderHeader() {
  const hdrTasks = document.getElementById("hdrTasks");
  const hdrMakespan = document.getElementById("hdrMakespan");
  const hdrSelftest = document.getElementById("hdrSelftest");

  hdrTasks.textContent = state.tasks.length + " TASKS";

  if (state.result && state.result.ok) {
    hdrMakespan.textContent = "MAKESPAN " + state.result.makespan + "d";
  } else {
    hdrMakespan.textContent = "MAKESPAN —";
  }

  const st = state.selftest;
  if (st) {
    hdrSelftest.textContent = "SELFTEST " + st.passed + "/" + st.total;
    hdrSelftest.className = "badge " + (st.passed === st.total ? "st-ok" : "st-bad");
  }
}

/* ============================================================
   RENDER: TABLE
   ============================================================ */
function renderTable() {
  const wrap = document.getElementById("tableWrap");
  wrap.innerHTML = "";

  const r = state.result;
  const critSet = Object.create(null);
  if (r && r.ok) for (const id of r.critical) critSet[id] = true;

  const table = el("table");
  const thead = el("thead");
  const trh = el("tr");
  ["ID", "DUR", "DEPS", "START", "FINISH", "SLACK"].forEach(h => {
    trh.appendChild(el("th", { text: h }));
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = el("tbody");
  for (const t of state.tasks) {
    const isCrit = critSet[t.id];
    const tr = el("tr", { class: isCrit ? "crit" : "" });

    tr.appendChild(el("td", { class: "tid", text: t.id }));

    const durInput = el("input", {
      class: "dur",
      type: "number",
      min: "0",
      step: "1",
      value: String(t.dur)
    });
    durInput.addEventListener("change", function () {
      const v = parseFloat(durInput.value);
      if (isFinite(v) && v >= 0) {
        t.dur = v;
        recompute();
      } else {
        durInput.value = String(t.dur);
      }
    });
    const tdDur = el("td");
    tdDur.appendChild(durInput);
    tr.appendChild(tdDur);

    const tdDeps = el("td", { class: "deps" });
    for (const d of t.deps) {
      const chip = el("span", { class: "d" + (critSet[d] && isCrit ? " crit" : "") });
      chip.appendChild(document.createTextNode(d));
      const x = el("span", { class: "x", text: "×" });
      x.addEventListener("click", function () {
        t.deps = t.deps.filter(dd => dd !== d);
        recompute();
      });
      chip.appendChild(x);
      tdDeps.appendChild(chip);
    }
    // add dependency control
    const addWrap = el("div", { class: "adddep" });
    const sel = el("select");
    sel.appendChild(el("option", { value: "", text: "+dep" }));
    for (const other of state.tasks) {
      if (other.id === t.id) continue;
      if (t.deps.indexOf(other.id) !== -1) continue;
      sel.appendChild(el("option", { value: other.id, text: other.id }));
    }
    const btn = el("button", { text: "add" });
    btn.addEventListener("click", function () {
      const v = sel.value;
      if (v) {
        t.deps.push(v);
        recompute();
      }
    });
    addWrap.appendChild(sel);
    addWrap.appendChild(btn);
    tdDeps.appendChild(addWrap);
    tr.appendChild(tdDeps);

    if (r && r.ok) {
      tr.appendChild(el("td", { class: "num", text: String(r.start[t.id]) }));
      tr.appendChild(el("td", { class: "num", text: String(r.finish[t.id]) }));
      // slack
      let slackVal = "—";
      if (r.critical.indexOf(t.id) !== -1) slackVal = "0";
      tr.appendChild(el("td", { class: "num", text: slackVal }));
    } else {
      tr.appendChild(el("td", { class: "num", text: "—" }));
      tr.appendChild(el("td", { class: "num", text: "—" }));
      tr.appendChild(el("td", { class: "num", text: "—" }));
    }

    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
}

/* ============================================================
   RENDER: ERROR
   ============================================================ */
function renderError() {
  const wrap = document.getElementById("errWrap");
  wrap.innerHTML = "";
  const r = state.result;
  if (r && !r.ok) {
    wrap.appendChild(el("div", { class: "err", text: "ERROR: " + r.error }));
  }
}

/* ============================================================
   RENDER: GANTT
   ============================================================ */
function renderGantt() {
  const wrap = document.getElementById("ganttWrap");
  wrap.innerHTML = "";
  const r = state.result;
  if (!r || !r.ok) {
    wrap.appendChild(el("div", { style: "color:var(--bad);padding:8px 0", text: "No schedule (error)." }));
    return;
  }

  const tasks = state.tasks;
  const n = tasks.length;
  const makespan = r.makespan;
  const critSet = Object.create(null);
  for (const id of r.critical) critSet[id] = true;

  const rowH = GANTT.rowH;
  const padTop = GANTT.padTop;
  const padLeft = GANTT.padLeft;
  const padRight = GANTT.padRight;
  const padBottom = GANTT.padBottom;
  const barH = GANTT.barH;

  const width = 640;
  const height = padTop + n * rowH + padBottom;
  const plotW = width - padLeft - padRight;
  const scale = makespan > 0 ? plotW / makespan : plotW;

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  // background
  const bg = document.createElementNS(svgNS, "rect");
  bg.setAttribute("x", "0");
  bg.setAttribute("y", "0");
  bg.setAttribute("width", String(width));
  bg.setAttribute("height", String(height));
  bg.setAttribute("fill", COLORS.panel2);
  svg.appendChild(bg);

  // grid lines per day
  for (let d = 0; d <= makespan; d++) {
    const x = padLeft + d * scale;
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", String(x));
    line.setAttribute("y1", String(padTop));
    line.setAttribute("x2", String(x));
    line.setAttribute("y2", String(padTop + n * rowH));
    line.setAttribute("stroke", COLORS.grid);
    line.setAttribute("stroke-width", "1");
    svg.appendChild(line);

    const label = document.createElementNS(svgNS, "text");
    label.setAttribute("x", String(x));
    label.setAttribute("y", String(height - 6));
    label.setAttribute("fill", COLORS.dim);
    label.setAttribute("font-size", "9");
    label.setAttribute("text-anchor", "middle");
    label.textContent = String(d);
    svg.appendChild(label);
  }

  // rows
  for (let i = 0; i < n; i++) {
    const t = tasks[i];
    const y = padTop + i * rowH;
    const isCrit = critSet[t.id];

    // row label
    const lbl = document.createElementNS(svgNS, "text");
    lbl.setAttribute("x", String(padLeft - 6));
    lbl.setAttribute("y", String(y + rowH / 2 + 3));
    lbl.setAttribute("fill", isCrit ? COLORS.crit : COLORS.accent);
    lbl.setAttribute("font-size", "10");
    lbl.setAttribute("text-anchor", "end");
    lbl.textContent = t.id;
    svg.appendChild(lbl);

    // row separator
    const sep = document.createElementNS(svgNS, "line");
    sep.setAttribute("x1", String(padLeft));
    sep.setAttribute("y1", String(y + rowH));
    sep.setAttribute("x2", String(padLeft + plotW));
    sep.setAttribute("y2", String(y + rowH));
    sep.setAttribute("stroke", COLORS.line);
    sep.setAttribute("stroke-width", "0.5");
    svg.appendChild(sep);

    // bar
    const s = r.start[t.id];
    const f = r.finish[t.id];
    const bx = padLeft + s * scale;
    const bw = Math.max(1, (f - s) * scale);
    const by = y + (rowH - barH) / 2;

    const rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("x", String(bx));
    rect.setAttribute("y", String(by));
    rect.setAttribute("width", String(bw));
    rect.setAttribute("height", String(barH));
    rect.setAttribute("rx", "2");
    rect.setAttribute("fill", isCrit ? COLORS.crit : COLORS.accent);
    rect.setAttribute("opacity", "0.9");
    svg.appendChild(rect);

    // duration label inside bar if wide enough
    if (bw > 16) {
      const txt = document.createElementNS(svgNS, "text");
      txt.setAttribute("x", String(bx + bw / 2));
      txt.setAttribute("y", String(by + barH / 2 + 3));
      txt.setAttribute("fill", "#04121f");
      txt.setAttribute("font-size", "9");
      txt.setAttribute("text-anchor", "middle");
      txt.textContent = String(t.dur);
      svg.appendChild(txt);
    }
  }

  wrap.appendChild(svg);
}

/* ============================================================
   RENDER: META
   ============================================================ */
function renderMeta() {
  const meta = document.getElementById("meta");
  meta.innerHTML = "";
  const r = state.result;
  if (!r || !r.ok) {
    meta.appendChild(el("span", { text: "—" }));
    return;
  }
  meta.appendChild(el("span", { html: "MAKESPAN <b>" + r.makespan + "d</b>" }));
  meta.appendChild(el("span", { html: "WORKERS <b>" + state.workers + "</b>" }));
  meta.appendChild(el("span", {
    html: "CRITICAL <span class='critv'>" + r.critical.join(" → ") + "</span>"
  }));
}

/* ============================================================
   RENDER: FOOTER
   ============================================================ */
function renderFooter() {
  const footer = document.getElementById("footer");
  footer.innerHTML = "";
  const st = state.selftest;
  if (!st) return;
  footer.appendChild(el("span", { html: "SELFTEST <b>" + st.passed + "/" + st.total + "</b>" }));
  if (st.failures.length === 0) {
    footer.appendChild(el("span", { class: "p", text: "ALL PASS" }));
  } else {
    for (const f of st.failures) {
      footer.appendChild(el("span", { class: "f", text: "FAIL: " + f }));
    }
  }
}

/* ============================================================
   RENDER: WORKERS
   ============================================================ */
function renderWorkers() {
  const wrap = document.getElementById("workers");
  const btns = wrap.querySelectorAll("button");
  btns.forEach(b => {
    const w = parseInt(b.getAttribute("data-w"), 10);
    if (w === state.workers) b.classList.add("on");
    else b.classList.remove("on");
  });
}

/* ============================================================
   RENDER ALL
   ============================================================ */
function render() {
  renderHeader();
  renderTable();
  renderError();
  renderGantt();
  renderMeta();
  renderWorkers();
  renderFooter();
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
function wireWorkers() {
  const wrap = document.getElementById("workers");
  wrap.addEventListener("click", function (e) {
    const btn = e.target.closest("button");
    if (!btn) return;
    const w = parseInt(btn.getAttribute("data-w"), 10);
    if (isFinite(w) && w >= 1 && w <= 3) {
      state.workers = w;
      recompute();
    }
  });
}

/* ============================================================
   RESIZE HANDLER
   ============================================================ */
let resizeTimer = null;
function onResize() {
  if (resizeTimer !== null) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    resizeTimer = null;
    renderGantt();
  }, 60);
}

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  state.selftest = window.__selftest();
  wireWorkers();
  window.addEventListener("resize", onResize);
  recompute();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</body>
