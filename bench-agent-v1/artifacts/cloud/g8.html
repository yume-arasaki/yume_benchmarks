<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Siege</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e11}
canvas{display:block}
#hud{position:fixed;top:14px;left:16px;z-index:2;color:#d7e2ee;font:12px/1.7 "JetBrains Mono",ui-monospace,Menlo,monospace;
 letter-spacing:.06em;background:#0b0e11b8;border:1px solid #243040;border-radius:6px;padding:8px 11px;pointer-events:none}
#hud b{color:#ff8a3d;font-weight:600}#hud i{color:#7d8fa3;font-style:normal}
</style></head>
<body>
<div id="hud"><b>SIEGE</b> · <span id="cycle">1</span><br>
<i>WALL</i> <span id="wall">0</span> · <i>BOULDERS</i> <span id="shots">0</span> · <i>TROOPS</i> <span id="troops">0</span></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";

const SEED = 7;
function rng(s){ let a=(s|0)||1; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rand = rng(SEED);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio||1));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#c9d9e2");
scene.fog = new THREE.Fog("#c9d9e2", 120, 260);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 600);
let yaw = 0.75, pitch = 0.55, dist = 150, drag = false, lastX = 0, lastY = 0, idle = 0;
function place(){ camera.position.set(Math.cos(yaw)*Math.cos(pitch)*dist, 26 + Math.sin(pitch)*dist, Math.sin(yaw)*Math.cos(pitch)*dist);
  camera.lookAt(0, 16, 26); }
place();

scene.add(new THREE.HemisphereLight("#e8f2ff", "#4a4436", 1.15));
const sun = new THREE.DirectionalLight("#fff0d6", 1.55); sun.position.set(-60, 90, 50); scene.add(sun);

const M = (c, r=0.9) => new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:0.03 });
const mesh = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); scene.add(m); return m; };

// ---------------------------------------------------------------- ground + mountain + river
mesh(new THREE.BoxGeometry(420, 2, 420), M("#6b7f52", 1), 0, -1, 40);
// plateau under the castle
mesh(new THREE.BoxGeometry(110, 14, 80), M("#7d6a52"), 0, 6, 6);
mesh(new THREE.BoxGeometry(120, 4, 90), M("#6f5f4a"), 0, 13, 6);
// rocky shoulders
for (let i=0;i<16;i++){
  const x = -55 + rand()*110, z = -25 + rand()*70;
  mesh(new THREE.BoxGeometry(6+rand()*12, 4+rand()*10, 6+rand()*12), M(i%2?"#6a5a46":"#7a6852"), x, 12+rand()*4, z);
}
// ridge for the trebuchets
mesh(new THREE.BoxGeometry(90, 10, 26), M("#6d5b46"), 0, 5, 44);
// river: three angled strips
for (const [x,z,r] of [[-70,70,0.2],[-20,80,0.05],[35,88,-0.15]]){
  const w = mesh(new THREE.BoxGeometry(80, 0.6, 14), new THREE.MeshStandardMaterial({ color:"#3f7f9a", roughness:0.25, metalness:0.2 }), x, 0.2, z);
  w.rotation.y = r;
}

// ---------------------------------------------------------------- castle wall (instanced, damageable)
const BLOCK = 2.6, COLS = 22, ROWS = 5;
const wallGeo = new THREE.BoxGeometry(BLOCK, BLOCK, BLOCK*1.4);
const wall = new THREE.InstancedMesh(wallGeo, M("#9a9486"), COLS*ROWS*2);
const zero = new THREE.Matrix4().makeScale(0,0,0);
const dummy = new THREE.Object3D();
let wallAlive = 0;
const blockPos = [];
let wi = 0;
for (let side=0; side<2; side++){
  for (let c=0;c<COLS;c++){
    for (let r=0;r<ROWS;r++){
      const x = (c - COLS/2 + 0.5) * BLOCK;
      const y = 15 + r * BLOCK;
      const z = side ? -8 : 8;
      dummy.position.set(x, y, z);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      wall.setMatrixAt(wi, dummy.matrix);
      blockPos.push({ i:wi, x, y, z, gone:false });
      wi++; wallAlive++;
    }
  }
}
wall.count = wi; wall.instanceMatrix.needsUpdate = true; scene.add(wall);

// towers + keep
for (const sx of [-1, 1]){
  const tx = sx * (COLS/2 + 0.5) * BLOCK;
  mesh(new THREE.CylinderGeometry(5, 5.6, 26, 8), M("#8d887b"), tx, 24, 0);
  mesh(new THREE.ConeGeometry(6.2, 8, 8), M("#5a4a3a"), tx, 41, 0);
}
mesh(new THREE.BoxGeometry(26, 24, 20), M("#958f82"), 0, 26, -18);
mesh(new THREE.ConeGeometry(19, 12, 4), M("#5a4a3a"), 0, 44, -18).rotation.y = Math.PI/4;

// ---------------------------------------------------------------- forest (instanced)
const TREES = 1400;
const treeGeo = new THREE.ConeGeometry(1.5, 6, 5);
const trees = new THREE.InstancedMesh(treeGeo, M("#2f5a3a", 1), TREES);
for (let i=0;i<TREES;i++){
  let x = -190 + rand()*380, z = -110 + rand()*300;
  if (Math.abs(x) < 70 && z > -30 && z < 100) { x = (x < 0 ? -1 : 1) * (75 + rand()*100); }
  const s = 0.7 + rand()*1.6;
  dummy.position.set(x, 3*s, z);
  dummy.scale.set(s, s, s);
  dummy.rotation.set(0, rand()*Math.PI, 0);
  dummy.updateMatrix(); trees.setMatrixAt(i, dummy.matrix);
}
trees.instanceMatrix.needsUpdate = true; scene.add(trees);

// ---------------------------------------------------------------- camp: tents, soldiers, fires
const TENTS = 320;
const tentGeo = new THREE.ConeGeometry(2.4, 3.6, 4);
const tents = new THREE.InstancedMesh(tentGeo, M("#d8cfb8", 1), TENTS);
for (let i=0;i<TENTS;i++){
  const x = -70 + rand()*140, z = 58 + rand()*60;
  const s = 0.7 + rand()*1.2;
  dummy.position.set(x, 1.8*s, z);
  dummy.scale.set(s,s,s);
  dummy.rotation.set(0, rand()*Math.PI, 0);
  dummy.updateMatrix(); tents.setMatrixAt(i, dummy.matrix);
}
tents.instanceMatrix.needsUpdate = true; scene.add(tents);

const SOLDIERS = 2200;
const soldierGeo = new THREE.BoxGeometry(0.7, 1.9, 0.7);
const soldiers = new THREE.InstancedMesh(soldierGeo, M("#6a5f52"), SOLDIERS);
for (let i=0;i<SOLDIERS;i++){
  const x = -78 + rand()*156, z = 52 + rand()*70;
  dummy.position.set(x, 1.0, z);
  dummy.rotation.set(0, rand()*Math.PI, 0);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix(); soldiers.setMatrixAt(i, dummy.matrix);
}
soldiers.instanceMatrix.needsUpdate = true; scene.add(soldiers);

const fires = [];
for (let i=0;i<14;i++){
  const x = -62 + rand()*124, z = 58 + rand()*58;
  mesh(new THREE.CylinderGeometry(1.1, 1.4, 0.5, 6), M("#4a3a2a"), x, 0.3, z);
  const flame = mesh(new THREE.ConeGeometry(0.7, 1.8, 5),
    new THREE.MeshBasicMaterial({ color:"#ff9a3c", transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false }), x, 1.4, z);
  fires.push(flame);
}

// siege towers
for (const x of [-28, 26]){
  mesh(new THREE.BoxGeometry(9, 22, 9), M("#5f4d3a"), x, 11, 34);
  mesh(new THREE.BoxGeometry(11, 2, 11), M("#6f5a44"), x, 22, 34);
  for (const dz of [-3.5, 3.5]) for (const dx of [-3.5, 3.5])
    mesh(new THREE.CylinderGeometry(1.2, 1.2, 1, 10), M("#3a2f24"), x+dx, 0.6, 34+dz).rotation.z = Math.PI/2;
}

// ---------------------------------------------------------------- trebuchets
const trebs = [];
for (const x of [-18, 0, 18]){
  const g = new THREE.Group(); g.position.set(x, 15.5, 40); scene.add(g);
  const base = new THREE.Mesh(new THREE.BoxGeometry(7, 1.4, 10), M("#5b4632")); g.add(base);
  const a1 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 9, 0.7), M("#6b543c")); a1.position.set(-2.2, 5, 0); a1.rotation.z = 0.25; g.add(a1);
  const a2 = a1.clone(); a2.position.x = 2.2; a2.rotation.z = -0.25; g.add(a2);
  const pivot = new THREE.Group(); pivot.position.set(0, 9, 0); g.add(pivot);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(16, 0.7, 0.7), M("#7a6044")); arm.position.x = -3; pivot.add(arm);
  const cw = new THREE.Mesh(new THREE.BoxGeometry(3.4, 3.4, 3.4), M("#4a3a2a")); cw.position.set(-10.5, -1.2, 0); pivot.add(cw);
  const sling = new THREE.Mesh(new THREE.BoxGeometry(0.16, 4.6, 0.16), M("#b9a07a")); sling.position.set(4.6, -2.1, 0); arm.add(sling);
  const boulder = new THREE.Mesh(new THREE.SphereGeometry(1.3, 10, 8), M("#7d7466", 1));
  boulder.position.set(4.6, -4.2, 0); arm.add(boulder);
  trebs.push({ g, pivot, boulder, state:"wait", t: 1 + rand()*3, cycle: 0 });
}
const flying = [];   // boulders in the air, scene-level
const debris = [];
const dusts = [];

// ---------------------------------------------------------------- impact helpers
function damage(x, y){
  let hit = 0;
  for (const b of blockPos){
    if (b.gone) continue;
    if (Math.abs(b.x - x) < 5.5 && Math.abs(b.y - y) < 5.5){
      wall.setMatrixAt(b.i, zero); b.gone = true; hit++; wallAlive--;
    }
  }
  wall.instanceMatrix.needsUpdate = true;
  for (let i=0;i<16;i++){
    const d = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.8), M("#9a9486"));
    d.position.set(x + (rand()-0.5)*4, y + (rand()-0.5)*4, 8);
    d.userData.v = new THREE.Vector3((rand()-0.5)*7, 2+rand()*7, (rand()-0.3)*3);
    d.userData.life = 2.2 + rand();
    scene.add(d); debris.push(d);
  }
  const p = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8),
    new THREE.MeshBasicMaterial({ color:"#c9bfa8", transparent:true, opacity:0.5, depthWrite:false }));
  p.position.set(x, y, 8); p.userData.life = 1.6; scene.add(p); dusts.push(p);
  return hit;
}

// ---------------------------------------------------------------- controls
renderer.domElement.addEventListener("pointerdown", (e) => { drag = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener("pointerup", () => { drag = false; });
addEventListener("pointermove", (e) => {
  if (drag){ yaw -= (e.clientX - lastX) * 0.006; pitch = Math.max(0.08, Math.min(1.2, pitch + (e.clientY - lastY) * 0.004)); lastX = e.clientX; lastY = e.clientY; idle = 0; }
});
addEventListener("wheel", (e) => { dist = Math.max(45, Math.min(190, dist + e.deltaY * 0.05)); }, { passive:true });
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------------------------------------------------------------- loop
const $ = (id) => document.getElementById(id);
let shots = 0, cycle = 1;
const clock = new THREE.Clock();

function animate(){
  const dt = Math.min(1/30, clock.getDelta());
  idle += dt; if (!drag && idle > 4) yaw += dt * 0.06;
  place();

  for (const t of trebs){
    if (t.state === "wait"){
      t.t -= dt;
      if (t.t <= 0){
        t.state = "swing"; t.t = 0; t.pivot.rotation.z = -0.85;
      }
    } else if (t.state === "swing"){
      t.t += dt;
      t.pivot.rotation.z = -0.85 + Math.min(1, t.t / 0.45) * 1.75;
      if (t.t > 0.45){
        const b = new THREE.Mesh(new THREE.SphereGeometry(1.3, 10, 8), M("#7d7466", 1));
        b.position.set(t.g.position.x, 19.5, 42);
        b.userData.v = new THREE.Vector3((rand()-0.5)*2, 6.5, -25);
        b.userData.life = 6;
        scene.add(b); flying.push(b);
        t.state = "wait"; t.t = 4 + rand()*3;
        shots++;
      }
    }
  }

  for (let i = flying.length - 1; i >= 0; i--){
    const b = flying[i], v = b.userData.v;
    v.y -= 9.8 * dt;
    b.position.addScaledVector(v, dt);
    b.rotation.x += dt * 3;
    if (b.position.z <= 8.5 && b.position.z > -12 && b.position.y < 26 && b.position.y > 10){
      damage(b.position.x, b.position.y);
      scene.remove(b); flying.splice(i, 1); b.userData.life = 0;
    } else if (b.position.y < 0 || b.userData.life < 0){
      scene.remove(b); flying.splice(i, 1);
    } else b.userData.life -= dt;
  }

  for (let i = debris.length - 1; i >= 0; i--){
    const d = debris[i], v = d.userData.v;
    v.y -= 18 * dt;
    d.position.addScaledVector(v, dt);
    d.rotation.x += dt * 4; d.rotation.z += dt * 3;
    d.userData.life -= dt;
    d.material.transparent = true; d.material.opacity = Math.max(0, Math.min(1, d.userData.life));
    if (d.userData.life <= 0 || d.position.y < 0){ scene.remove(d); debris.splice(i, 1); }
  }
  for (let i = dusts.length - 1; i >= 0; i--){
    const p = dusts[i];
    p.userData.life -= dt;
    const k = Math.max(0, p.userData.life);
    p.scale.setScalar(1 + (1.6 - k) * 5);
    p.material.opacity = k * 0.32;
    if (k <= 0){ scene.remove(p); dusts.splice(i, 1); }
  }

  for (const f of fires) f.material.opacity = 0.65 + Math.sin(performance.now()*0.006 + f.position.x) * 0.2;

  $("cycle").textContent = cycle;
  $("wall").textContent = Math.round((wallAlive/(COLS*ROWS*2))*100) + "%";
  $("shots").textContent = shots;
  $("troops").textContent = SOLDIERS + TENTS*2;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
window.__dbg = () => ({ trebs: trebs.map((t) => t.state + ":" + t.t.toFixed(1)), shots, flying: flying.length, wall: wallAlive });
animate();
</script>
</body></html>
