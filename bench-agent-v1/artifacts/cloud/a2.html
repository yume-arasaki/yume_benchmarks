<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PLANNER</title>
<style>
:root{--bg:#0b0e11;--panel:#11161c;--line:#243040;--ink:#d7e2ee;--dim:#7d8fa3;--sig:#39d0d8;--hot:#ff8a3d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 "JetBrains Mono",ui-monospace,Menlo,monospace;overflow:hidden}
header{display:flex;gap:14px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line)}
header b{color:var(--sig)}#st{margin-left:auto;color:var(--dim)}#st.ok{color:#7ee787}#st.bad{color:var(--hot)}
main{display:grid;grid-template-rows:auto 1fr;height:calc(100% - 43px);min-height:0}
.ctl{display:flex;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);color:var(--dim)}
input,select{background:#0f151c;color:var(--ink);border:1px solid var(--line);border-radius:4px;font:inherit;padding:3px 6px}
input.num{width:52px}input.dep{width:120px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-weight:400}
th{color:var(--dim);font-size:11px;letter-spacing:.1em}
tr.crit td{color:var(--hot)}
#gantt{position:relative;margin:14px 16px;height:180px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar{position:absolute;height:22px;background:#1d4b57;border:1px solid var(--sig);border-radius:3px;font-size:10px;color:var(--ink);padding:2px 5px;white-space:nowrap}
.bar.crit{background:#4a2a17;border-color:var(--hot);color:#ffd7bd}
#axis{position:absolute;left:0;right:0;bottom:0;height:18px;border-top:1px solid var(--line)}
#axis i{position:absolute;top:2px;color:var(--dim);font-style:normal;font-size:10px;transform:translateX(-50%)}
</style></head>
<body>
<header><b>PLANNER</b><span id="sum">— TASKS · MAKESPAN —</span><span id="st">SELFTEST —</span></header>
<main>
 <div class="ctl">workers <select id="w"><option>1</option><option>2</option><option selected>3</option></select>
   <span id="crit">critical: —</span></div>
 <div>
  <table><thead><tr><th>id</th><th>dur</th><th>deps</th><th>start</th><th>finish</th></tr></thead><tbody id="rows"></tbody></table>
  <div id="gantt"><div id="axis"></div></div>
 </div>
</main>
<script>
const DEF = [
 {id:"A",dur:2,deps:[]},{id:"B",dur:3,deps:["A"]},{id:"C",dur:4,deps:["A"]},{id:"D",dur:1,deps:["B","C"]}
];

function schedule(tasks, workers){
  workers = Math.max(1, workers|0);
  const map = new Map();
  for (const t of tasks||[]){
    if (!t || typeof t.id !== "string" || !t.id) return {ok:false, error:"bad task"};
    map.set(t.id, {id:t.id, dur:Math.max(0, Math.floor(Number(t.dur)||0)), deps:(t.deps||[]).slice()});
  }
  for (const t of map.values()) for (const d of t.deps) if (!map.has(d)) return {ok:false, error:"missing dep "+d};
  // cycle check (Kahn)
  const indeg = new Map(); for (const t of map.values()) indeg.set(t.id, t.deps.length);
  const q = []; for (const [id,d] of indeg) if (!d) q.push(id);
  const order = []; while (q.length){ const id=q.shift(); order.push(id);
    for (const t of map.values()) if (t.deps.includes(id)){ const n=indeg.get(t.id)-1; indeg.set(t.id,n); if(!n) q.push(t.id); } }
  if (order.length !== map.size) return {ok:false, error:"cycle"};
  // dependency-only ES/EF, for the critical chain
  const depES = new Map(), depEF = new Map();
  for (const id of order){ const t=map.get(id);
    const es = t.deps.length ? Math.max(...t.deps.map(d=>depEF.get(d))) : 0;
    depES.set(id, es); depEF.set(id, es + t.dur); }
  const depMakespan = Math.max(0, ...depEF.values());
  let critical = [];
  let tail = [...depEF.entries()].filter(([,ef]) => ef === depMakespan).sort((a,b)=>a[0]<b[0]?-1:1)[0];
  if (tail && depMakespan > 0){ let id = tail[0];
    while (id){ critical.unshift(id); const t = map.get(id); if (!t.deps.length) break;
      id = t.deps.slice().sort().find(d => depEF.get(d) === depES.get(id)) || null; } }
  // resource-limited list scheduling
  const start = new Map(), finish = new Map(); let running = []; const ready = new Set();
  for (const [id,t] of map) if (!t.deps.length) ready.add(id);
  let now = 0, guard = 0;
  while (finish.size < map.size && guard++ < 10000){
    running = running.filter(r => r.end > now);
    for (const [id,t] of map) if (!finish.has(id) && !running.some(r=>r.id===id) &&
        t.deps.every(d => finish.has(d) && finish.get(d) <= now))
      ready.add(id);
    const cand = [...ready].filter(id => !running.some(r=>r.id===id))
      .sort((a,b) => (depES.get(a)-depES.get(b)) || (a<b?-1:1));
    while (running.length < workers && cand.length){
      const id = cand.shift(); ready.delete(id);
      const t = map.get(id);
      start.set(id, now); finish.set(id, now + t.dur);
      if (t.dur > 0) running.push({id, end: now + t.dur});
    }
    if (!running.length) continue;
    now = Math.min(...running.map(r=>r.end));
  }
  const makespan = Math.max(0, ...finish.values());
  return { ok:true, makespan: makespan,
    start: Object.fromEntries(start), finish: Object.fromEntries(finish), critical: critical };
}

function selftest(){
  const f = [], t = (n, ok, got) => { if (!ok) f.push(n + " -> " + JSON.stringify(got)); };
  const r = schedule(DEF, 3);
  t("makespan 7", r.ok && r.makespan === 7, r);
  t("critical A,C,D", JSON.stringify(r.critical) === JSON.stringify(["A","C","D"]), r.critical);
  const depsOk = DEF.every(x => (r.start[x.id] >= Math.max(0, ...x.deps.map(d=>r.finish[d]))));
  t("deps respected", depsOk, r.start);
  const serial = schedule(DEF, 1);
  const overlap = (s) => { const iv = DEF.map(x=>[s.start[x.id], s.finish[x.id]]).sort((a,b)=>a[0]-b[0]);
    return iv.some((v,i)=> i>0 && v[0] < iv[i-1][1]); };
  t("workers 1 no overlap", !overlap(serial) && serial.makespan === 10, serial);
  const cyc = schedule([{id:"X",dur:1,deps:["Y"]},{id:"Y",dur:1,deps:["X"]}], 2);
  t("cycle rejected", cyc.ok === false, cyc);
  const missing = schedule([{id:"X",dur:1,deps:["Q"]}], 1);
  t("missing dep rejected", missing.ok === false, missing);
  return { passed: 6 - f.length, total: 6, failures: f };
}

window.API = { schedule: schedule };
window.__selftest = selftest;

let TASKS = DEF.map(x => ({id:x.id, dur:x.dur, deps:x.deps.slice()}));
const $ = (id) => document.getElementById(id);

function draw(){
  const workers = Number($("w").value);
  const r = schedule(TASKS, workers);
  const body = $("rows");
  body.innerHTML = TASKS.map(t => {
    const s = r.ok ? r.start[t.id] : "—", f = r.ok ? r.finish[t.id] : "—";
    const crit = r.ok && r.critical.includes(t.id) ? " class='crit'" : "";
    return "<tr" + crit + "><td>" + t.id + "</td>" +
      "<td><input class='num' data-id='" + t.id + "' data-k='dur' value='" + t.dur + "'></td>" +
      "<td><input class='dep' data-id='" + t.id + "' data-k='deps' value='" + t.deps.join(",") + "'></td>" +
      "<td>" + s + "</td><td>" + f + "</td></tr>";
  }).join("");
  $("sum").textContent = TASKS.length + " TASKS · MAKESPAN " + (r.ok ? r.makespan : "—") + "d";
  $("crit").textContent = "critical: " + (r.ok ? (r.critical.join(" → ") || "—") : r.error);
  const g = $("gantt");
  [...g.querySelectorAll(".bar,#axis i")].forEach(n => n.remove());
  if (!r.ok) return;
  const span = Math.max(1, r.makespan), box = g.getBoundingClientRect();
  TASKS.forEach(t => {
    const b = document.createElement("div");
    b.className = "bar" + (r.critical.includes(t.id) ? " crit" : "");
    b.style.left = (r.start[t.id] / span * 100) + "%";
    b.style.width = "calc(" + (t.dur / span * 100) + "% - 2px)";
    b.style.top = (12 + TASKS.findIndex(x=>x.id===t.id) * 28) + "px";
    b.textContent = t.id;
    g.appendChild(b);
  });
  const axis = document.createElement("div"); axis.id = "axis";
  for (let d = 0; d <= span; d++){ const i = document.createElement("i");
    i.style.left = (d / span * 100) + "%"; i.textContent = d; axis.appendChild(i); }
  g.appendChild(axis);
}

document.addEventListener("input", (e) => {
  const el = e.target; if (!el.dataset || !el.dataset.id) return;
  const t = TASKS.find(x => x.id === el.dataset.id); if (!t) return;
  if (el.dataset.k === "dur") t.dur = Math.max(0, Math.floor(Number(el.value) || 0));
  else t.deps = el.value.split(",").map(s => s.trim()).filter(Boolean);
  draw();
});
$("w").addEventListener("change", draw);
draw();
const st = selftest();
$("st").textContent = "SELFTEST " + st.passed + "/" + st.total;
$("st").className = st.passed === st.total ? "ok" : "bad";
window.addEventListener("resize", draw);
</script>
</body></html>
