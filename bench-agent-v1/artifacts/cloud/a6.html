<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ORBIT</title>
<style>
:root{--bg:#0b0e11;--ink:#d7e2ee;--dim:#7d8fa3;--sig:#39d0d8;--hot:#ff8a3d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
header{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;gap:14px;align-items:baseline;
 padding:9px 16px;color:var(--ink);font:13px/1.4 "JetBrains Mono",ui-monospace,Menlo,monospace;
 background:linear-gradient(#0b0e11ee,#0b0e1100);pointer-events:none;letter-spacing:.04em}
header b{color:var(--sig)}#st{margin-left:auto;color:var(--dim)}#st.ok{color:#7ee787}#st.bad{color:#ff8a3d}
canvas{display:block}
#tip{position:fixed;z-index:4;pointer-events:none;display:none;background:#11161ce8;border:1px solid #243040;
 border-radius:4px;padding:4px 7px;color:var(--ink);font:11px/1.4 ui-monospace;white-space:nowrap}
#scale{position:fixed;right:16px;bottom:16px;z-index:3;color:var(--dim);font:10px/1.5 ui-monospace;
 background:#0b0e11cc;border:1px solid #243040;border-radius:4px;padding:6px 8px}
#scale i{display:inline-block;width:14px;height:8px;margin-right:3px;vertical-align:middle}
</style></head>
<body>
<header><b>ORBIT</b><span id="hdr">20,000 MARKS · — FPS</span><span id="st">SELFTEST —</span></header>
<div id="tip"></div>
<div id="scale"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";

const COLS = 200, ROWS = 100, SEED = 7;
const PAL = ["#123a4d", "#1f7a8c", "#39d0d8", "#ffb86b", "#ff8a3d"];
const DIFF = ["#0c1014", "#141b22"];

function rng(seed){ let a = (seed|0) || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#0b0e11");
scene.fog = new THREE.Fog("#0b0e11", 34, 78);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 200);
let yaw = 0.7, pitch = 0.55, dist = 52, dragging = false;

scene.add(new THREE.HemisphereLight("#bfe9ff", "#0a141a", 1.15));
const key = new THREE.DirectionalLight("#ffffff", 1.35); key.position.set(18, 30, 12); scene.add(key);
const rim = new THREE.DirectionalLight("#9fd7ff", 0.75); rim.position.set(-22, 16, 34); scene.add(rim);

const r = rng(SEED);
const heights = new Float32Array(COLS * ROWS);
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
  const i = y * COLS + x;
  const sx = x / COLS, sy = y / ROWS;
  const field = Math.sin(sx * 9.1) * Math.cos(sy * 12.7) * 0.5 +
                Math.sin((sx + sy) * 23.3) * 0.22 +
                Math.exp(-((sx-0.62)**2 + (sy-0.38)**2) * 28) * 1.25;
  heights[i] = Math.max(0.12, 0.55 + field * 0.85 + (r() - 0.5) * 0.18);
}

const geo = new THREE.BoxGeometry(0.62, 1, 0.62);
const mat = new THREE.MeshStandardMaterial({ roughness: 0.72, metalness: 0.0 });
const mesh = new THREE.InstancedMesh(geo, mat, COLS * ROWS);
mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
const dummy = new THREE.Object3D(), colour = new THREE.Color();
let lo = Infinity, hi = -Infinity;
for (let i = 0; i < heights.length; i++){ lo = Math.min(lo, heights[i]); hi = Math.max(hi, heights[i]); }
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
  const i = y * COLS + x, h = heights[i];
  dummy.position.set((x - COLS/2) * 0.78, h/2, (y - ROWS/2) * 0.78);
  dummy.scale.set(1, h, 1);
  dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
  const t = (h - lo) / Math.max(1e-6, hi - lo);
  colour.set(PAL[Math.min(PAL.length-1, Math.floor(t * PAL.length))]);
  mesh.setColorAt(i, colour);
}
mesh.instanceMatrix.needsUpdate = true; if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
scene.add(mesh);

const grid = new THREE.GridHelper(64, 16, 0x1b2a36, 0x14202a); grid.position.y = -0.01; scene.add(grid);
const axes = new THREE.AxesHelper(9); axes.position.set(-COLS/2*0.78, 0.02, -ROWS/2*0.78); scene.add(axes);

let fps = 0, frames = 0, acc = 0, last = performance.now();
function placeCamera(){
  camera.position.set(Math.cos(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist + 4, Math.sin(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(0, 3, 0);
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = document.getElementById("tip");
let pointer = null;

function countNaN(){
  const a = mesh.instanceMatrix.array; let n = 0;
  for (let i = 0; i < a.length; i++) if (!Number.isFinite(a[i])) n++;
  return n;
}
function stats(){ return { instances: mesh.count, fps: +fps.toFixed(1), nan: countNaN() }; }

function selftest(){
  const f = [], t = (n, ok, got) => { if (!ok) f.push(n + " -> " + JSON.stringify(got)); };
  t("20000 instances", mesh.count === 20000, mesh.count);
  t("no NaN", countNaN() === 0, countNaN());
  const h = heights[500], y = mesh.instanceMatrix.array[500*16 + 13];
  t("sits on ground", Math.abs(y - h/2) < 1e-4, { y, h });
  t("palette colours", PAL.every((c) => /^#[0-9a-f]{6}$/i.test(c)), PAL);
  t("camera orbits", typeof yaw === "number" && typeof dist === "number", { yaw, dist });
  t("fps is finite", Number.isFinite(fps), fps);
  t("tooltip hidden", getComputedStyle(tip).display === "none", getComputedStyle(tip).display);
  // the checks above prove the data; these prove pixels
  const box = new THREE.Box3().setFromObject(mesh), c = box.getCenter(new THREE.Vector3()).project(camera);
  t("field in frame", Math.abs(c.x) < 1 && Math.abs(c.y) < 1 && c.z < 1, { x:+c.x.toFixed(2), y:+c.y.toFixed(2), z:+c.z.toFixed(2) });
  t("renderer drew triangles", renderer.info.render.triangles > 1000, renderer.info.render.triangles);
  return { passed: 9 - f.length, total: 9, failures: f };
}
window.API = { stats: stats };
window.__selftest = selftest;

document.getElementById("scale").innerHTML = PAL.map((c) => "<i style='background:" + c + "'></i>").join("") + "value";

renderer.domElement.addEventListener("pointerdown", (e) => { dragging = true; pointer = { x:e.clientX, y:e.clientY }; });
window.addEventListener("pointerup", () => { dragging = false; });
window.addEventListener("pointermove", (e) => {
  if (dragging && pointer){ yaw -= (e.clientX - pointer.x) * 0.005; pitch = Math.max(0.12, Math.min(1.35, pitch + (e.clientY - pointer.y) * 0.004)); }
  pointer = { x:e.clientX, y:e.clientY };
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
});
renderer.domElement.addEventListener("pointerleave", () => { pointer = null; tip.style.display = "none"; });
window.addEventListener("wheel", (e) => { dist = Math.max(18, Math.min(96, dist + e.deltaY * 0.03)); }, { passive:true });

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let tipTick = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!dragging) yaw += dt * 0.12;
  placeCamera();
  if (pointer && (tipTick++ % 2 === 0)){
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(mesh, false)[0];
    if (hit && hit.instanceId != null){
      tip.style.display = "block"; tip.style.left = (pointer.x + 12) + "px"; tip.style.top = (pointer.y + 12) + "px";
      tip.textContent = "mark " + hit.instanceId + " · h " + heights[hit.instanceId].toFixed(2);
    } else tip.style.display = "none";
  }
  renderer.render(scene, camera);
  frames++; acc += dt;
  if (acc >= 0.5){ fps = frames / acc; frames = 0; acc = 0;
    document.getElementById("hdr").textContent = "20,000 MARKS · " + fps.toFixed(0) + " FPS"; }
  requestAnimationFrame(frame);
}
placeCamera();
requestAnimationFrame(frame);
const st = selftest();
document.getElementById("st").textContent = "SELFTEST " + st.passed + "/" + st.total;
document.getElementById("st").className = st.passed === st.total ? "ok" : "bad";
</script>
</body></html>
